<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .header h1 i {
            color: #667eea;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .filters h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #667eea;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3838;
        }

        .btn-success {
            background: #2ed573;
            color: white;
        }

        .btn-success:hover {
            background: #26d063;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid;
        }

        .stat-card.info {
            border-left-color: #667eea;
        }

        .stat-card.warning {
            border-left-color: #ffa502;
        }

        .stat-card.critical {
            border-left-color: #ff4757;
        }

        .stat-card.success {
            border-left-color: #2ed573;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .stat-subtext {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .logs-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .logs-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logs-header h3 {
            color: #333;
            font-size: 14px;
        }

        .logs-count {
            font-size: 12px;
            color: #999;
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .logs-table thead {
            background: #f8f9fa;
        }

        .logs-table th {
            padding: 15px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0e0e0;
        }

        .logs-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s ease;
        }

        .logs-table tbody tr:hover {
            background: #f8f9fa;
        }

        .logs-table tbody td {
            padding: 15px;
            font-size: 13px;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.info {
            background: #e8eef7;
            color: #667eea;
        }

        .badge.warning {
            background: #fff5e6;
            color: #ffa502;
        }

        .badge.critical {
            background: #ffe6e6;
            color: #ff4757;
        }

        .badge.success {
            background: #e6f7f1;
            color: #2ed573;
        }

        .operation-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }

        .op-create {
            background: #e6f7f1;
            color: #2ed573;
        }

        .op-read {
            background: #e8eef7;
            color: #667eea;
        }

        .op-update {
            background: #fff5e6;
            color: #ffa502;
        }

        .op-delete {
            background: #ffe6e6;
            color: #ff4757;
        }

        .op-download {
            background: #e8eef7;
            color: #667eea;
        }

        .action-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .action-link:hover {
            color: #5568d3;
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            color: #555;
        }

        .detail-row {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .detail-label {
            flex: 0 0 120px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .detail-value {
            flex: 1;
            color: #333;
            font-size: 13px;
            word-break: break-word;
        }

        .detail-json {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            overflow-x: auto;
            color: #555;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-size: 12px;
            color: #999;
            margin: 0 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .chart-title {
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .chart-bars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .chart-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: capitalize;
        }

        .bar {
            height: 200px;
            background: #f0f0f0;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 5px;
        }

        @media (max-width: 768px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .logs-table {
                font-size: 12px;
            }

            .logs-table td,
            .logs-table th {
                padding: 10px;
            }

            .modal-content {
                max-width: 90vw;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <script src="js/notification-system.js"></script>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-shield-alt"></i>
                Audit Logs Dashboard
            </h1>
            <p>Monitor dan analisis semua aktivitas sistem untuk compliance dan security</p>
        </div>

        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat-card info">
                <div class="stat-label">Total Logs</div>
                <div class="stat-value">-</div>
                <div class="stat-subtext">Semua waktu</div>
            </div>
            <div class="stat-card critical">
                <div class="stat-label">Suspicious Activity</div>
                <div class="stat-value">-</div>
                <div class="stat-subtext">Perlu review</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">Critical Actions</div>
                <div class="stat-value">-</div>
                <div class="stat-subtext">Bulan ini</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">Users Active</div>
                <div class="stat-value">-</div>
                <div class="stat-subtext">Hari ini</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <h3>Filter Logs</h3>
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="resourceType">Resource Type</label>
                    <select id="resourceType">
                        <option value="">Semua Resource</option>
                        <option value="invoice">Invoice</option>
                        <option value="file">File</option>
                        <option value="user">User</option>
                        <option value="zona">Zona</option>
                        <option value="toko">Toko</option>
                        <option value="ticket">Ticket</option>
                        <option value="system">System</option>
                        <option value="report">Report</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="operation">Operation</label>
                    <select id="operation">
                        <option value="">Semua Operation</option>
                        <option value="CREATE">CREATE</option>
                        <option value="UPDATE">UPDATE</option>
                        <option value="DELETE">DELETE</option>
                        <option value="READ">READ</option>
                        <option value="DOWNLOAD">DOWNLOAD</option>
                        <option value="BULK_DELETE">BULK_DELETE</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="severity">Severity</label>
                    <select id="severity">
                        <option value="">Semua Severity</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="isSuspicious">Suspicious Only</label>
                    <select id="isSuspicious">
                        <option value="">Semua</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>

                <div class="filter-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <i class="fas fa-search"></i> Apply Filters
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <i class="fas fa-redo"></i> Reset
                </button>
                <button class="btn btn-secondary" onclick="exportCSV()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button class="btn btn-danger" onclick="markReviewed()" id="markReviewedBtn" style="display: none;">
                    <i class="fas fa-check-circle"></i> Mark as Reviewed
                </button>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="logs-container">
            <div class="logs-header">
                <h3><i class="fas fa-list"></i> Activity Logs</h3>
                <div class="logs-count">Total: <span id="logCount">0</span></div>
            </div>

            <div id="logsContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading logs...</p>
                </div>
            </div>

            <div class="pagination">
                <button onclick="previousPage()" id="prevBtn" disabled>← Previous</button>
                <div class="page-info">
                    Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                </div>
                <button onclick="nextPage()" id="nextBtn" disabled>Next →</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Audit Log Detail</h2>
                <button class="modal-close" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="detailContent"></div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = '/api';
        let currentPage = 1;
        let currentFilters = {};
        let allLogs = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadLogs();
            loadStats();
        });

        async function loadLogs() {
            const params = new URLSearchParams({
                limit: 20,
                offset: (currentPage - 1) * 20,
                ...currentFilters
            });

            try {
                const response = await fetch(`${API_BASE}/audit-logs?${params}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load logs');

                const data = await response.json();
                allLogs = data.logs;

                renderLogs(data.logs);

                // Update pagination
                const totalPages = Math.ceil(data.pagination.total / data.pagination.limit);
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('logCount').textContent = data.pagination.total;

                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = !data.pagination.hasMore;

            } catch (error) {
                console.error('Error loading logs:', error);
                document.getElementById('logsContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading logs</p>
                    </div>
                `;
            }
        }

        async function loadStats() {
            const params = new URLSearchParams({
                startDate: new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString()
            });

            try {
                const response = await fetch(`${API_BASE}/audit-logs/stats?${params}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load stats');

                const data = await response.json();
                
                // Update stats cards with data
                document.querySelectorAll('.stat-value')[0].textContent = data.totalLogs || 0;
                document.querySelectorAll('.stat-value')[1].textContent = data.suspiciousActivity || 0;
                document.querySelectorAll('.stat-value')[2].textContent = data.criticalActions || 0;
                document.querySelectorAll('.stat-value')[3].textContent = data.usersActive || 0;

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function renderLogs(logs) {
            if (!logs || logs.length === 0) {
                document.getElementById('logsContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No logs found</p>
                    </div>
                `;
                return;
            }

            let html = `<table class="logs-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Resource</th>
                        <th>Operation</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>`;

            logs.forEach(log => {
                const date = new Date(log.created_at).toLocaleString('id-ID');
                const severityClass = log.severity || 'info';
                const operationClass = `op-${log.operation.toLowerCase()}`;
                const suspicious = log.is_suspicious ? '⚠️ Yes' : 'No';

                html += `<tr>
                    <td>${date}</td>
                    <td>
                        <small>${log.user_email || 'System'}</small><br>
                        <span class="badge ${severityClass}">${log.user_role || 'N/A'}</span>
                    </td>
                    <td>${log.action}</td>
                    <td>
                        <span class="badge ${severityClass}">${log.resource_type}</span><br>
                        <small>${log.resource_name || '-'}</small>
                    </td>
                    <td><span class="operation-badge ${operationClass}">${log.operation}</span></td>
                    <td><span class="badge ${severityClass}">${log.severity || 'info'}</span></td>
                    <td>${log.status_code} ${suspicious}</td>
                    <td><a class="action-link" onclick="showDetail(${log.id})">View</a></td>
                </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('logsContent').innerHTML = html;
        }

        async function showDetail(logId) {
            try {
                const response = await fetch(`${API_BASE}/audit-logs/${logId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load detail');

                const log = await response.json();

                let detailHtml = `
                    <div class="detail-row">
                        <div class="detail-label">Timestamp</div>
                        <div class="detail-value">${new Date(log.created_at).toLocaleString('id-ID')}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">User</div>
                        <div class="detail-value">
                            ${log.user_email}<br>
                            <small>${log.user_role}</small>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Action</div>
                        <div class="detail-value">${log.action}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Resource</div>
                        <div class="detail-value">
                            Type: ${log.resource_type}<br>
                            ID: ${log.resource_id}<br>
                            Name: ${log.resource_name || '-'}
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Operation</div>
                        <div class="detail-value">${log.operation}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Severity</div>
                        <div class="detail-value"><span class="badge ${log.severity}">${log.severity}</span></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">${log.status_code} ${log.is_suspicious ? '⚠️ SUSPICIOUS' : 'OK'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">IP Address</div>
                        <div class="detail-value">${log.ip_address || '-'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Request Path</div>
                        <div class="detail-value">${log.request_path}</div>
                    </div>
                `;

                if (log.old_values) {
                    detailHtml += `
                        <div class="detail-row">
                            <div class="detail-label">Old Values</div>
                            <div class="detail-value">
                                <div class="detail-json">${JSON.stringify(log.old_values, null, 2)}</div>
                            </div>
                        </div>
                    `;
                }

                if (log.new_values) {
                    detailHtml += `
                        <div class="detail-row">
                            <div class="detail-label">New Values</div>
                            <div class="detail-value">
                                <div class="detail-json">${JSON.stringify(log.new_values, null, 2)}</div>
                            </div>
                        </div>
                    `;
                }

                if (log.error_message) {
                    detailHtml += `
                        <div class="detail-row">
                            <div class="detail-label">Error</div>
                            <div class="detail-value">${log.error_message}</div>
                        </div>
                    `;
                }

                document.getElementById('detailContent').innerHTML = detailHtml;
                document.getElementById('detailModal').classList.add('active');

            } catch (error) {
                console.error('Error loading detail:', error);
                Notify.error('Failed to load detail');
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function applyFilters() {
            currentFilters = {
                resourceType: document.getElementById('resourceType').value,
                operation: document.getElementById('operation').value,
                severity: document.getElementById('severity').value,
                isSuspicious: document.getElementById('isSuspicious').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            };

            // Remove empty values
            Object.keys(currentFilters).forEach(key => {
                if (!currentFilters[key]) delete currentFilters[key];
            });

            currentPage = 1;
            loadLogs();
        }

        function resetFilters() {
            document.getElementById('resourceType').value = '';
            document.getElementById('operation').value = '';
            document.getElementById('severity').value = '';
            document.getElementById('isSuspicious').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';

            currentFilters = {};
            currentPage = 1;
            loadLogs();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadLogs();
                window.scrollTo(0, 0);
            }
        }

        function nextPage() {
            currentPage++;
            loadLogs();
            window.scrollTo(0, 0);
        }

        async function exportCSV() {
            const params = new URLSearchParams(currentFilters);
            try {
                const response = await fetch(`${API_BASE}/audit-logs/export/csv?${params}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `audit-logs-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                console.error('Error exporting CSV:', error);
                Notify.error('Failed to export CSV');
            }
        }

        async function markReviewed() {
            const suspiciousLogs = allLogs.filter(log => log.is_suspicious).map(log => log.id);

            if (suspiciousLogs.length === 0) {
                Notify.warning('No suspicious logs to mark as reviewed');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/audit-logs/mark-reviewed`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ logIds: suspiciousLogs })
                });

                if (!response.ok) throw new Error('Failed to mark as reviewed');

                Notify.success('Marked as reviewed');
                loadLogs();
            } catch (error) {
                console.error('Error marking as reviewed:', error);
                Notify.error('Failed to mark as reviewed');
            }
        }
    </script>
</body>
</html>
