    <script>
        let filesToUpload = [];
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const btnUpload = document.getElementById('btnUpload');
        const filesList = document.getElementById('filesList');
        const filesContainer = document.getElementById('filesContainer');
        const stats = document.getElementById('stats');
        const validating = document.getElementById('validating');

        // Drop zone events
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFileSelect(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files);
        });

        async function handleFileSelect(files) {
            filesToUpload = Array.from(files).filter(f => f.type === 'application/pdf');
            
            if (filesToUpload.length === 0) {
                Toast.error('Hanya file PDF yang diterima');
                return;
            }

            validating.style.display = 'block';
            filesList.style.display = 'none';

            // Scan and validate files
            const validated = await Promise.all(filesToUpload.map(async (file, idx) => {
                let filename = file.name.replace(/\.pdf$/i, '').trim();
                filename = filename.replace(/\.pdf$/i, '').trim();
                
                const taxMatch = filename.match(/^tax-(\d+)\s+(.+?)\s+([\d.]+)$/i);
                const isValid = !!taxMatch;

                let info = {
                    file,
                    index: idx,
                    isValid,
                    filename
                };

                if (isValid && taxMatch) {
                    info.noFaktur = taxMatch[1];
                    info.namaFromFile = taxMatch[2];
                    info.nominalFromFile = taxMatch[3];

                    try {
                        const res = await fetch(`/api/invoice/check-faktur/${info.noFaktur}`, {
                            headers: { 'Authorization': `Bearer ${API.getToken()}` }
                        });
                        if (res.ok) {
                            const result = await res.json();
                            if (result.exists && result.data) {
                                info.tokoName = result.data.konsumen || info.namaFromFile;
                                info.nominal = result.data.total_jumlah_jual || 0;
                                
                                if (result.data.faktur_pajak_path) {
                                    try {
                                        const checkRes = await fetch(`/api/invoice/check-file/${info.noFaktur}/faktur_pajak`, {
                                            headers: { 'Authorization': `Bearer ${API.getToken()}` }
                                        });
                                        const checkData = await checkRes.json();
                                        
                                        if (checkData.exists) {
                                            info.isValid = false;
                                            info.errorMsg = 'Faktur Pajak sudah diupload (Duplicate)';
                                        } else {
                                            // File path in DB but not in GDrive - allow re-upload
                                            info.isValid = true;
                                        }
                                    } catch (verifyErr) {
                                        // If verification fails, assume file is gone - allow re-upload
                                        console.log('Verification error (allowing re-upload):', verifyErr);
                                        info.isValid = true;
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.log('Error fetching invoice info:', e);
                    }
                }

                return info;
            }));

            validating.style.display = 'none';

            // Update stats
            const validCount = validated.filter(v => v.isValid).length;
            const invalidCount = validated.filter(v => !v.isValid).length;

            document.getElementById('totalFiles').textContent = validated.length;
            document.getElementById('validFiles').textContent = validCount;
            document.getElementById('invalidFiles').textContent = invalidCount;
            stats.style.display = validated.length > 0 ? 'grid' : 'none';

            // Render file list
            filesContainer.innerHTML = validated.map(item => `
                <div class="file-item ${item.isValid ? 'valid' : 'invalid'}">
                    <div class="file-item-icon">
                        ${item.isValid ? '✓' : '✗'}
                    </div>
                    <div class="file-item-name">
                        <strong>${item.file.name}</strong>
                        <div class="file-item-info">
                            ${item.isValid ? 
                                `NO: <strong>${item.noFaktur}</strong> | NAMA: <strong>${item.tokoName || item.namaFromFile || '?'}</strong> | NOMINAL: <strong>${item.nominal ? 'Rp' + item.nominal.toLocaleString('id-ID') : item.nominalFromFile || '?'}</strong>` :
                                `${item.errorMsg || 'ERROR: Format Nama File Tidak Sesuai'}`
                            }
                        </div>
                    </div>
                    ${!item.isValid ? `
                        <button class="delete-btn" onclick="deleteFile(${item.index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');

            filesList.style.display = 'block';
            btnUpload.disabled = validCount === 0;
        }

        function deleteFile(index) {
            filesToUpload.splice(index, 1);
            if (filesToUpload.length === 0) {
                filesList.style.display = 'none';
                stats.style.display = 'none';
                fileInput.value = '';
            } else {
                handleFileSelect(filesToUpload);
            }
        }

        function resetUpload() {
            filesToUpload = [];
            fileInput.value = '';
            filesList.style.display = 'none';
            stats.style.display = 'none';
            filesContainer.innerHTML = '';
            btnUpload.disabled = true;
        }

        btnUpload.addEventListener('click', async () => {
            const validFiles = filesToUpload.filter(f => {
                let filename = f.name.replace(/\.pdf$/i, '').trim();
                filename = filename.replace(/\.pdf$/i, '').trim();
                return /^tax-(\d+)\s+(.+?)\s+([\d.]+)$/i.test(filename);
            });

            if (validFiles.length === 0) {
                Toast.error('Tidak ada file valid');
                return;
            }

            const overlay = document.getElementById('uploadOverlay');
            overlay.classList.add('show');

            let successCount = 0;
            let failCount = 0;

            for (let i = 0; i < validFiles.length; i++) {
                const file = validFiles[i];
                document.getElementById('uploadProgress').textContent = `${i + 1}/${validFiles.length} files`;

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('type', 'faktur_pajak');

                    const response = await fetch('/api/invoice/upload-document', {
                        method: 'POST',
                        body: formData,
                        headers: { 'Authorization': `Bearer ${API.getToken()}` }
                    });

                    if (response.ok) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (err) {
                    failCount++;
                }
            }

            overlay.classList.remove('show');

            if (successCount > 0) {
                Toast.success(`✅ ${successCount} file berhasil diupload!`);
                resetUpload();
            }
            if (failCount > 0) {
                Toast.error(`⚠️ ${failCount} file gagal diupload`);
            }
        });

        (async () => {
            try {
                const user = await initAuth(['super_admin', 'moderator']);
                if (!user) {
                    console.error('User not authenticated');
                }
            } catch (error) {
                console.error('Init error:', error);
            }
        })();
    </script>
