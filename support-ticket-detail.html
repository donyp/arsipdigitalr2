<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Tiket - Support</title>
    
    <!-- EARLY REDIRECT for admin_zona users accessing old URL -->
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            // Only redirect if accessing old URL path
            if (id && window.location.pathname.includes('support-ticket-detail.html')) {
                // Try localStorage first (faster)
                try {
                    const userData = localStorage.getItem('user_data');
                    if (userData) {
                        const user = JSON.parse(userData);
                        if (user.role === 'admin_zona') {
                            window.location.replace(`/zona/ticket?id=${id}`);
                            return;
                        }
                    }
                } catch (e) {
                    // Continue if localStorage check fails
                }
                
                // If localStorage check didn't work, still redirect for admin_zona
                // The server will serve the right page based on the route
                // This prevents the glitch by redirecting unconditionally to new URL
                window.location.replace(`/zona/ticket?id=${id}`);
            }
        })();
    </script>
    
    <!-- DARK MODE - Apply immediately to prevent flash -->
    <script>
        (function() {
            if (localStorage.getItem('dark_mode_enabled') === 'true') {
                document.documentElement.setAttribute('data-dark-mode', 'true');
                document.documentElement.style.cssText = `

                    --color-bg-tertiary: #334155;
                    --color-text-primary: #f1f5f9;
                    --color-text-secondary: #cbd5e1;
                    --color-text-tertiary: #94a3b8;
                    --color-border: #475569;
                    --color-border-dark: #64748b;
                    --color-accent: #3b82f6;
                `;
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

        #replyStatus.loading::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: relative;
                top: auto;
            }
            
            .ticket-status-row {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .ticket-subject {
                font-size: 22px;
            }
        }
    </style>
</head>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let ticketId = null;
        let ticketData = null;
        const DEBUG = false; // Set to true for debugging

        document.addEventListener('DOMContentLoaded', async () => {
            if (DEBUG) console.log('[Ticket-Detail] Page loaded');
            
            const params = new URLSearchParams(window.location.search);
            ticketId = params.get('id');
            
            if (!ticketId) {
                document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: No ticket ID provided</div>';
                return;
            }

            await initAuth();
            
            if (!currentUser) {
                window.location.href = '/login';
                return;
            }

            await loadTicketDetail();
        });

        async function loadTicketDetail() {
            try {
                const token = localStorage.getItem('jwt_token');
                
                const response = await fetch(`/api/support/tickets/${ticketId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load ticket: ${response.status}`);
                }

                const data = await response.json();
                ticketData = data.ticket;

                // Get zona name - fetch all zonas and find by zona_id
                let zonaName = 'N/A';
                
                if (currentUser.zona_id) {
                    try {
                        const zonaResponse = await fetch(`/api/zonas`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (zonaResponse.ok) {
                            const zonaData = await zonaResponse.json();
                            
                            // Handle different response formats
                            let zonas = [];
                            if (Array.isArray(zonaData)) {
                                zonas = zonaData;
                            } else if (zonaData.data && Array.isArray(zonaData.data)) {
                                zonas = zonaData.data;
                            } else if (zonaData.zonas && Array.isArray(zonaData.zonas)) {
                                zonas = zonaData.zonas;
                            }
                            
                            // Find by id (try both string and number comparison)
                            const userZona = zonas.find(z => z.id == currentUser.zona_id || String(z.id) === String(currentUser.zona_id));
                            
                            if (userZona) {
                                zonaName = userZona.nama || userZona.name || userZona.Nama || 'N/A';
                            }
                        }
                    } catch (e) {
                        if (DEBUG) console.warn('[Ticket-Detail] Could not fetch zonas:', e);
                    }
                }

                renderTicketDetail(zonaName);
                renderMessages(zonaName);

            } catch (error) {
                console.error('[Ticket-Detail] Error:', error);
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>${error.message}</div>
                    </div>
                `;
            }
        }

        function renderTicketDetail(zonaName) {
            const ticket = ticketData;
            const priorityClass = (ticket.priority || 'Medium').toLowerCase();

            const ticketNumberEl = document.getElementById('ticketNumber');
            if (ticketNumberEl) ticketNumberEl.textContent = ticket.ticket_number || 'N/A';
            
            const ticketSubjectEl = document.getElementById('ticketSubject');
            if (ticketSubjectEl) {
                ticketSubjectEl.textContent = ticket.subject || 'N/A';
                ticketSubjectEl.style.background = 'none';
                ticketSubjectEl.style.animation = 'none';
                ticketSubjectEl.style.minHeight = 'auto';
            }
            
            const ticketStatusEl = document.getElementById('ticketStatus');
            if (ticketStatusEl) ticketStatusEl.textContent = ticket.status || 'Open';
            
            const priorityBadge = document.getElementById('ticketPriority');
            if (priorityBadge) {
                priorityBadge.textContent = ticket.priority || 'Medium';
                priorityBadge.className = `priority-badge priority-${priorityClass}`;
                priorityBadge.style.background = '';
                priorityBadge.style.color = '';
            }

            const sidebarStatus = document.getElementById('sidebarStatus');
            const sidebarPriority = document.getElementById('sidebarPriority');
            const sidebarCategory = document.getElementById('sidebarCategory');
            const sidebarCreated = document.getElementById('sidebarCreated');
            const sidebarLastReply = document.getElementById('sidebarLastReply');
            const sidebarTotalMessages = document.getElementById('sidebarTotalMessages');

            if (sidebarStatus) {
                sidebarStatus.textContent = ticket.status || '-';
                sidebarStatus.style.background = 'none';
                sidebarStatus.style.animation = 'none';
                sidebarStatus.style.height = 'auto';
                sidebarStatus.style.width = 'auto';
            }
            if (sidebarPriority) {
                sidebarPriority.textContent = ticket.priority || '-';
                sidebarPriority.style.background = 'none';
                sidebarPriority.style.animation = 'none';
                sidebarPriority.style.height = 'auto';
                sidebarPriority.style.width = 'auto';
            }
            if (sidebarCategory) {
                sidebarCategory.textContent = ticket.category || '-';
                sidebarCategory.style.background = 'none';
                sidebarCategory.style.animation = 'none';
                sidebarCategory.style.height = 'auto';
                sidebarCategory.style.width = 'auto';
            }
            
            const createdFormatted = formatDateTimeWIB(ticket.created_at);
            if (sidebarCreated) {
                sidebarCreated.textContent = createdFormatted;
                sidebarCreated.style.background = 'none';
                sidebarCreated.style.animation = 'none';
                sidebarCreated.style.height = 'auto';
                sidebarCreated.style.width = 'auto';
            }
            
            if (sidebarLastReply) {
                sidebarLastReply.textContent = getLastReplyTime(ticket);
                sidebarLastReply.style.background = 'none';
                sidebarLastReply.style.animation = 'none';
                sidebarLastReply.style.height = 'auto';
                sidebarLastReply.style.width = 'auto';
            }
            if (sidebarTotalMessages) {
                sidebarTotalMessages.textContent = (ticketData.messages || []).length + 1;
                sidebarTotalMessages.style.background = 'none';
                sidebarTotalMessages.style.animation = 'none';
                sidebarTotalMessages.style.height = 'auto';
                sidebarTotalMessages.style.width = 'auto';
            }
        }

        function renderMessages(zonaName) {
            let html = '';
            
            if (ticketData.description) {
                // Clean zona name - remove leading zeros and extract number
                let cleanZonaName = zonaName;
                if (zonaName && zonaName !== 'N/A') {
                    // If it's "Zona 01", extract just "1"
                    const match = zonaName.match(/(\d+)/);
                    if (match) {
                        cleanZonaName = match[1].replace(/^0+/, '') || '0';
                    }
                }
                
                html += `
                    <div class="message-item">
                        <div class="message-avatar customer">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header-row">
                                <span class="message-author">Zona ${cleanZonaName}</span>
                                <span class="message-role anda">ANDA</span>
                                <span class="message-time">${formatDateTimeWIB(ticketData.created_at)}</span>
                            </div>
                            <div class="message-body">${escapeHtml(ticketData.description)}</div>
                        </div>
                    </div>
                `;
            }
            
            const messages = ticketData.messages || [];
            
            if (messages.length === 0) {
                html += `
                    <div class="empty-state" style="padding: 40px 24px; border-top: 1px solid #f3f4f6;">
                        <div class="empty-state-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <div style="font-size: 13px;">Tidak ada balasan dari support team</div>
                    </div>
                `;
            } else {
                html += messages.map(msg => {
                    const isSupport = msg.user_id !== currentUser.userId;
                    const roleClass = !isSupport ? 'anda' : '';
                    
                    // Clean zona name for replies too
                    let cleanZonaName = zonaName;
                    if (zonaName && zonaName !== 'N/A') {
                        const match = zonaName.match(/(\d+)/);
                        if (match) {
                            cleanZonaName = match[1].replace(/^0+/, '') || '0';
                        }
                    }
                    
                    return `
                        <div class="message-item">
                            <div class="message-avatar ${isSupport ? 'support' : 'customer'}">
                                ${isSupport ? '<i class="fas fa-headset"></i>' : '<i class="fas fa-user"></i>'}
                            </div>
                            <div class="message-content">
                                <div class="message-header-row">
                                    <span class="message-author">${isSupport ? 'Tim Support' : 'Zona ' + cleanZonaName}</span>
                                    <span class="message-role ${roleClass}">${!isSupport ? 'ANDA' : 'Support'}</span>
                                    <span class="message-time">${formatDateTimeWIB(msg.created_at)}</span>
                                </div>
                                <div class="message-body">${escapeHtml(msg.message)}</div>
                                ${msg.attachments && msg.attachments.length > 0 ? `
                                    <div class="message-attachments">
                                        ${msg.attachments.map(att => `
                                            <div class="attachment-item">
                                                <span class="attachment-icon"><i class="fas fa-file"></i></span>
                                                <a href="/api/support/tickets/${ticketId}/download/${att.id}" target="_blank">
                                                    ${att.file_name}
                                                </a>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('messagesContainer').innerHTML = html;
            
            // Add reply form after messages
            addReplyForm();
        }
        
        function addReplyForm() {
            const container = document.getElementById('messagesContainer');
            const replySection = document.createElement('div');
            replySection.className = 'reply-section';
            replySection.innerHTML = `
                <h3>Tambah Balasan</h3>
                <textarea id="replyMessage" placeholder="Ketik balasan anda di sini..."></textarea>
                <div class="reply-buttons">
                    <button class="btn-send" id="btnSendReply" onclick="sendReply()">
                        <i class="fas fa-paper-plane"></i> Kirim Balasan
                    </button>
                </div>
                <div id="replyStatus" style="margin-top: 8px; font-size: 12px; color: #6b7280; display: none;"></div>
            `;
            container.appendChild(replySection);
        }

        function getLastReplyTime(ticket) {
            const messages = ticket.messages || [];
            if (messages.length === 0) return '-';
            
            const lastMessage = messages[messages.length - 1];
            return formatRelativeTime(lastMessage.created_at);
        }

        function formatDateTimeWIB(dateString) {
            if (!dateString) return '-';
            
            try {
                // Parse the input string. If it doesn't have timezone info, treat as UTC
                let date;
                
                // Check if the string has timezone info
                const hasTimezone = /[Z+\-]\d{2}:?\d{2}$/.test(dateString) || dateString.endsWith('Z');
                
                if (!hasTimezone) {
                    // No timezone info - treat as UTC by adding Z
                    const normalizedString = dateString.replace(' ', 'T');
                    date = new Date(normalizedString + 'Z');
                } else {
                    // Has timezone info, parse as-is
                    date = new Date(dateString);
                }
                
                if (isNaN(date.getTime())) {
                    console.warn('[DateFormat] Invalid date string:', dateString);
                    return '-';
                }
                
                console.log('[DateFormat] Input:', dateString, '→ UTC:', date.toISOString());
                
                // Calculate WIB (UTC+7)
                const wibTime = new Date(date.getTime() + (7 * 60 * 60 * 1000));
                
                const year = wibTime.getUTCFullYear();
                const month = String(wibTime.getUTCMonth() + 1).padStart(2, '0');
                const day = String(wibTime.getUTCDate()).padStart(2, '0');
                const hours = String(wibTime.getUTCHours()).padStart(2, '0');
                const minutes = String(wibTime.getUTCMinutes()).padStart(2, '0');
                const seconds = String(wibTime.getUTCSeconds()).padStart(2, '0');
                
                const formatted = `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
                console.log('[DateFormat] Output (WIB):', formatted);
                
                return formatted;
            } catch (e) {
                console.error('[DateFormat] Error:', e);
                return '-';
            }
        }

        function formatRelativeTime(dateString) {
            if (!dateString) return '-';
            
            // Ensure date is parsed as UTC if no timezone info
            let date;
            const hasTimezone = /[Z+\-]\d{2}:?\d{2}$/.test(dateString) || dateString.endsWith('Z');
            
            if (!hasTimezone) {
                const normalizedString = dateString.replace(' ', 'T');
                date = new Date(normalizedString + 'Z');
            } else {
                date = new Date(dateString);
            }
            
            const now = new Date();
            const diffMs = now - date;
            const diffMinutes = Math.floor(diffMs / (1000 * 60));
            const diffHours = diffMs / (1000 * 60 * 60);
            const diffDays = diffMs / (1000 * 60 * 60 * 24);

            if (diffMinutes < 1) {
                return 'Baru saja';
            } else if (diffMinutes < 60) {
                return `${diffMinutes} menit yang lalu`;
            } else if (diffHours < 24) {
                return `${Math.floor(diffHours)}h lalu`;
            } else if (diffDays < 7) {
                return `${Math.floor(diffDays)}d lalu`;
            } else {
                return '-';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function sendReply() {
            try {
                const message = document.getElementById('replyMessage').value.trim();
                
                if (!message) {
                    alert('Pesan tidak boleh kosong');
                    return;
                }

                const btnSend = document.getElementById('btnSendReply');
                const statusDiv = document.getElementById('replyStatus');

                btnSend.disabled = true;
                statusDiv.style.display = 'block';
                statusDiv.classList.add('loading');
                statusDiv.textContent = 'Mengirim...';

                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/support/tickets/${ticketId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Gagal mengirim pesan');

                statusDiv.textContent = '✓ Pesan terkirim!';
                statusDiv.style.color = '#10b981';
                statusDiv.classList.remove('loading');
                document.getElementById('replyMessage').value = '';

                // Reload ticket after 1 second
                setTimeout(async () => {
                    await loadTicketDetail();
                }, 1000);

            } catch (error) {
                console.error('Error sending reply:', error);
                const statusDiv = document.getElementById('replyStatus');
                statusDiv.textContent = '✗ Error: ' + error.message;
                statusDiv.style.color = '#ef4444';
                statusDiv.style.display = 'block';
                statusDiv.classList.remove('loading');
                document.getElementById('btnSendReply').disabled = false;
            }
        }
    </script>
