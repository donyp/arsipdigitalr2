<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzdjM2FlZCIvPjx0ZXh0IHg9IjE2IiB5PSIyMyIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4=">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Management | Arsip Digital ANKA</title>
    <script>
        (function() {
            if (localStorage.getItem('dark_mode_enabled') === 'true') {
                document.documentElement.setAttribute('data-dark-mode', 'true');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f8fafc;
            --color-bg-tertiary: #f1f5f9;
            --color-text-primary: #0f172a;
            --color-text-secondary: #475569;
            --color-border: #e2e8f0;
            --color-accent: #3b82f6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        html[data-dark-mode="true"] body {
            background: var(--color-bg-primary) !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stat-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-accent);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.15);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent), #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .session-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .session-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transform: translateX(4px);
        }

        html[data-dark-mode="true"] .session-card:hover {
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--color-success);
        }

        .status-at-limit {
            background: rgba(245, 158, 11, 0.2);
            color: var(--color-warning);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--color-accent);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--color-danger);
        }

        .btn-danger:hover {
            background: var(--color-danger);
            color: white;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--color-bg-primary);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text-secondary);
            float: right;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--color-text-primary);
            transform: rotate(90deg);
        }

        .header-section {
            margin-bottom: 40px;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--color-accent), #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--color-accent);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
            transition: all 0.3s;
            z-index: 10;
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .role-super_admin {
            background: rgba(239, 68, 68, 0.2);
            color: var(--color-danger);
        }

        .role-moderator {
            background: rgba(139, 92, 246, 0.2);
            color: #a855f7;
        }

        .role-admin_zona {
            background: rgba(59, 130, 246, 0.2);
            color: var(--color-accent);
        }

        .role-user {
            background: rgba(148, 163, 184, 0.2);
            color: #64748b;
        }

        html, body {
            zoom: 0.8;
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Main Content -->
    <div id="main-content" class="ml-64 p-8" style="background: var(--color-bg-primary); min-height: 100vh;">
        <!-- Header -->
        <div class="header-section fade-in">
            <h1 class="header-title">🔐 Session Management</h1>
            <p class="header-subtitle">Monitor and manage active user sessions in real-time</p>
        </div>

        <!-- Stats Grid -->
        <div class="grid-stats fade-in" style="animation-delay: 0.1s">
            <div class="stat-card">
                <div style="font-size: 2rem; margin-bottom: 12px;">📊</div>
                <div style="font-size: 0.9rem; color: var(--color-text-secondary); margin-bottom: 8px;">Total Sessions</div>
                <div class="stat-value" id="total-sessions">-</div>
            </div>

            <div class="stat-card">
                <div style="font-size: 2rem; margin-bottom: 12px;">👥</div>
                <div style="font-size: 0.9rem; color: var(--color-text-secondary); margin-bottom: 8px;">Online Users</div>
                <div class="stat-value" id="online-users">-</div>
            </div>

            <div class="stat-card">
                <div style="font-size: 2rem; margin-bottom: 12px;">⚠️</div>
                <div style="font-size: 0.9rem; color: var(--color-text-secondary); margin-bottom: 8px;">At Limit</div>
                <div class="stat-value" id="at-limit-users">-</div>
            </div>
        </div>

        <!-- Sessions List -->
        <div style="background: var(--color-bg-secondary); border-radius: 16px; border: 1px solid var(--color-border); overflow: hidden; fade-in" style="animation-delay: 0.2s">
            <div style="padding: 24px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;">Active Users</h2>
                    <p style="color: var(--color-text-secondary); font-size: 0.9rem;">Manage sessions by user</p>
                </div>
                <button id="refresh-btn-top" class="btn btn-primary">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>

            <div style="padding: 24px;" id="sessions-container">
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="fas fa-inbox"></i>
                    </div>
                    <p>Loading sessions...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Session Details Modal -->
    <div id="session-modal" class="modal-overlay">
        <div class="modal-content">
            <button onclick="closeSessionModal()" class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <h3 id="modal-title" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 24px;">Session Details</h3>
            <div id="modal-content" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-dialog" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <h3 id="confirm-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 12px;">Confirm Action</h3>
            <p id="confirm-message" style="color: var(--color-text-secondary); margin-bottom: 24px; line-height: 1.6;"></p>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="closeConfirmDialog()" class="btn" style="background: var(--color-bg-tertiary); color: var(--color-text-primary);">
                    Cancel
                </button>
                <button id="confirm-btn" onclick="executeConfirmedAction()" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Force Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Refresh Button -->
    <button class="refresh-btn" onclick="refreshSessions()" title="Refresh sessions">
        <i class="fas fa-sync-alt"></i>
    </button>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        let pendingAction = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadSidebar();
            refreshSessions();
            document.getElementById('refresh-btn-top').addEventListener('click', refreshSessions);
            setInterval(refreshSessions, 30000);
        });

        async function refreshSessions() {
            try {
                const token = localStorage.getItem('jwt_token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('/api/admin/list-user-sessions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        const data = await response.json();
                        if (data.code === 'SESSION_TERMINATED') {
                            // User was force-logged out
                            localStorage.removeItem('jwt_token');
                            alert('Your session has been terminated. Please login again.');
                            window.location.href = '/login';
                            return;
                        }
                        localStorage.removeItem('jwt_token');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch sessions');
                }

                const data = await response.json();
                renderSessions(data.sessions || []);
                updateStats(data.sessions || []);

            } catch (err) {
                console.error('Error:', err);
                document.getElementById('sessions-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <p>Error loading sessions</p>
                    </div>
                `;
            }
        }

        function renderSessions(sessions) {
            const container = document.getElementById('sessions-container');
            
            if (!sessions || sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <p>No active sessions</p>
                    </div>
                `;
                return;
            }

            const groupedByUser = {};
            sessions.forEach(session => {
                const userId = session.user_id;
                if (!groupedByUser[userId]) {
                    groupedByUser[userId] = {
                        user_id: userId,
                        user_name: session.user_name,
                        user_email: session.user_email,
                        user_role: session.user_role,
                        sessions: [],
                        last_activity: null
                    };
                }
                groupedByUser[userId].sessions.push(session);
                const activityTime = new Date(session.last_activity || session.created_at);
                if (!groupedByUser[userId].last_activity || activityTime > new Date(groupedByUser[userId].last_activity)) {
                    groupedByUser[userId].last_activity = session.last_activity || session.created_at;
                }
            });

            container.innerHTML = Object.values(groupedByUser).map((user, idx) => {
                const sessionCount = user.sessions.length;
                const sessionLimit = user.user_role === 'moderator' || user.user_role === 'super_admin' ? 1 : 2;
                const isAtLimit = sessionCount >= sessionLimit;

                const lastActivityTime = new Date(user.last_activity);
                const now = new Date();
                const diffMinutes = Math.floor((now - lastActivityTime) / 60000);
                let activityStr = 'Just now';
                if (diffMinutes > 0 && diffMinutes < 60) activityStr = `${diffMinutes}m ago`;
                else if (diffMinutes >= 60) activityStr = `${Math.floor(diffMinutes/60)}h ago`;

                return `
                    <div class="session-card slide-in" style="animation-delay: ${idx * 0.05}s">
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                                <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--color-accent), #06b6d4); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.1rem;">
                                    ${user.user_name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div style="font-weight: 700; color: var(--color-text-primary);">${user.user_name}</div>
                                    <div style="font-size: 0.85rem; color: var(--color-text-secondary);">${user.user_email}</div>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                                <span class="role-badge role-${user.user_role}">${user.user_role}</span>
                                <span class="status-badge ${isAtLimit ? 'status-at-limit' : 'status-active'}">
                                    <i class="fas ${isAtLimit ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i>
                                    ${sessionCount}/${sessionLimit} sessions
                                </span>
                                <span style="font-size: 0.85rem; color: var(--color-text-secondary);">
                                    <i class="fas fa-history"></i> ${activityStr}
                                </span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="showSessionDetails('${user.user_id}')" class="btn btn-sm" style="background: var(--color-bg-tertiary); color: var(--color-accent);">
                                <i class="fas fa-eye"></i> Details
                            </button>
                            <button onclick="confirmForceLogout('${user.user_id}', '${user.user_email}')" class="btn btn-sm btn-danger">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats(sessions) {
            if (!sessions) sessions = [];
            document.getElementById('total-sessions').textContent = sessions.length;

            const uniqueUsers = new Set(sessions.map(s => s.user_id));
            document.getElementById('online-users').textContent = uniqueUsers.size;

            const groupedByUser = {};
            sessions.forEach(session => {
                if (!groupedByUser[session.user_id]) {
                    groupedByUser[session.user_id] = { count: 0, role: session.user_role };
                }
                groupedByUser[session.user_id].count++;
            });

            const atLimitCount = Object.values(groupedByUser).filter(user => {
                const limit = user.role === 'moderator' || user.role === 'super_admin' ? 1 : 2;
                return user.count >= limit;
            }).length;
            
            document.getElementById('at-limit-users').textContent = atLimitCount;
        }

        async function showSessionDetails(userId) {
            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/admin/user-sessions/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed');
                const data = await response.json();

                let html = `<div style="space-y: 16px;">`;
                data.sessions.forEach((sess, idx) => {
                    const expiresAt = new Date(sess.expires_at);
                    const createdAt = new Date(sess.created_at);
                    const isExpired = expiresAt < new Date();
                    const timeLeft = Math.round((expiresAt - new Date()) / 1000 / 60);

                    html += `
                        <div style="background: var(--color-bg-tertiary); padding: 16px; border-radius: 8px; margin-bottom: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <span style="font-weight: 700; font-size: 0.95rem;">Session ${idx + 1}</span>
                                <span class="status-badge ${sess.is_active ? 'status-active' : 'status-at-limit'}" style="font-size: 0.75rem;">
                                    ${sess.is_active ? '🟢 Active' : '🔴 Inactive'}
                                </span>
                            </div>
                            <div style="font-size: 0.85rem; color: var(--color-text-secondary); space-y: 8px; line-height: 1.6;">
                                <div><strong>Token:</strong> ${sess.session_token.substring(0, 20)}...</div>
                                <div><strong>Created:</strong> ${createdAt.toLocaleString('id-ID')}</div>
                                <div><strong>Expires:</strong> ${expiresAt.toLocaleString('id-ID')} ${isExpired ? '(Expired)' : `(${timeLeft} min left)`}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;

                document.getElementById('modal-title').textContent = `Sessions - ${data.user_name}`;
                document.getElementById('modal-content').innerHTML = html;
                document.getElementById('session-modal').classList.add('active');

            } catch (err) {
                alert('Error loading session details');
            }
        }

        function closeSessionModal() {
            document.getElementById('session-modal').classList.remove('active');
        }

        function confirmForceLogout(userId, userEmail) {
            document.getElementById('confirm-title').textContent = 'Force Logout?';
            document.getElementById('confirm-message').textContent = 
                `You're about to logout all sessions for ${userEmail}. They'll need to login again.`;
            
            pendingAction = { type: 'forceLogout', userId, userEmail };
            document.getElementById('confirm-dialog').classList.add('active');
        }

        function closeConfirmDialog() {
            document.getElementById('confirm-dialog').classList.remove('active');
            pendingAction = null;
        }

        async function executeConfirmedAction() {
            if (!pendingAction) return;

            try {
                const token = localStorage.getItem('jwt_token');
                const { userId, userEmail } = pendingAction;

                const response = await fetch(`/api/admin/force-logout-user/${userId}`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Force logout failed');
                }

                closeConfirmDialog();
                alert(`✅ Successfully logged out ${userEmail}`);
                refreshSessions();

            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        function toggleDarkMode() {
            const isDarkMode = localStorage.getItem('dark_mode_enabled') === 'true';
            localStorage.setItem('dark_mode_enabled', !isDarkMode);
            window.location.reload();
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('jwt_token');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
