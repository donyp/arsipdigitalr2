<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Arsip Digital ANKA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/js/dark-mode-init.js"></script>
    <link rel="stylesheet" href="/css/color-vars.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--color-bg-primary, #ffffff);
            color: var(--color-text-primary, #1f2937);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
        }

        /* Single moving animation: floating dot */
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--color-primary, #667eea);
            margin: 0 auto 2rem;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-24px); }
        }
        html[data-dark-mode="true"] .dot {
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }

        .code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--color-text-primary, #1f2937);
            margin-bottom: 0.5rem;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--color-text-primary, #1f2937);
        }

        .desc {
            font-size: 0.9rem;
            color: var(--color-text-secondary, #6b7280);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: var(--color-primary, #667eea);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: transparent;
            color: var(--color-text-primary, #1f2937);
            border: 1px solid var(--color-border, #e5e7eb);
        }
        .btn-ghost:hover {
            background: var(--color-bg-secondary, #f5f7fa);
        }

        html[data-dark-mode="true"] .btn-ghost:hover {
            background: var(--color-bg-tertiary, #334155);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: var(--color-text-muted, #9ca3af);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dot"></div>
        <div class="code">404</div>
        <h1 class="title">Halaman Tidak Ditemukan</h1>
        <p class="desc">
            Halaman yang Anda cari tidak tersedia atau telah dipindahkan.
            Silakan kembali ke halaman utama.
        </p>
        <div class="actions">
            <a href="/dashboard" class="btn btn-primary">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="/login" class="btn btn-ghost">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
        </div>
        <div class="footer">Arsip Digital ANKA</div>
    </div>
</body>
</html>
