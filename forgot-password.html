<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password | Arsip Digital ANKA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/tailwind.generated.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/color-vars.css">
    <script src="/js/zoom-reset.js"></script>
    <script src="/js/maintenance-banner.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script>
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: var(--color-bg-primary, #fff); color: var(--color-text-primary, #3d3b6b); }
        .container { max-width: 420px; margin: 80px auto; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        html[data-dark-mode="true"] .container { background: #1e293b; color: #f1f5f9; }
        .form-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #3d3b6b; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 16px; }
        .btn:hover { background: #2d2b5b; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #3d3b6b; }
        html[data-dark-mode="true"] .title { color: #60a5fa; }
        .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
        .msg { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
        .msg.success { background: #d1fae5; color: #047857; }
        .msg.error { background: #fee2e2; color: #991b1b; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #3d3b6b; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Lupa Password</h1>
        <p class="subtitle">Masukkan email terdaftar. Link reset password akan dikirim ke email tersebut.</p>
        <form id="forgot-form">
            <input type="email" id="email" class="form-input" placeholder="Email terdaftar" required>
            <button type="submit" id="submit-btn" class="btn">Kirim Link Reset</button>
        </form>
        <div id="msg" class="msg" style="display:none;"></div>
        <a href="/index.html" class="back-link">← Kembali ke Login</a>
    </div>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('msg');
            const email = document.getElementById('email').value.trim();
            btn.disabled = true;
            btn.textContent = 'Mengirim...';
            msg.style.display = 'none';
            try {
                const res = await API.post('/api/auth/forgot-password', { email });
                msg.className = 'msg success';
                msg.textContent = res.message || 'Link reset password telah dikirim.';
                msg.style.display = 'block';
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = err.message || 'Gagal mengirim link reset.';
                msg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kirim Link Reset';
            }
        });
    </script>
</body>
</html>
