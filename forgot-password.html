<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password | Arsip Digital ANKA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/js/dark-mode-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/color-vars.css">
    <script src="/js/notification-system.js?v=2"></script>
    <style>
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        .card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 12px;
        }
        .form-input {
            background: var(--color-bg-tertiary, #f0f2f5);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--color-accent, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            outline: none;
        }
        .btn-primary {
            background: var(--color-accent, #4f46e5);
            color: #ffffff;
            transition: opacity 0.2s ease;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-success { background: var(--color-status-success-bg, rgba(16,185,129,0.1)); color: var(--color-success-dark, #047857); border: 1px solid var(--color-success, #10b981); }
        .msg-error { background: var(--color-status-error-bg, rgba(239,68,68,0.1)); color: var(--color-error-dark, #991b1b); border: 1px solid var(--color-error, #ef4444); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md p-8 shadow-lg">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full mb-4" style="background: var(--color-accent-soft, #eef2ff);">
                <i class="fas fa-key text-2xl" style="color: var(--color-accent, #4f46e5);"></i>
            </div>
            <h1 class="text-2xl font-bold" style="color: var(--color-text-primary);">Lupa Password</h1>
            <p class="text-sm mt-2" style="color: var(--color-text-secondary, #6b7280);">Masukkan email terdaftar. Link reset password akan dikirim ke email tersebut.</p>
        </div>

        <form id="forgot-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" style="color: var(--color-text-primary);">Email</label>
                <input type="email" id="email" class="form-input w-full px-3 py-2 rounded-lg" placeholder="Email terdaftar" required>
            </div>
            <button type="submit" id="submit-btn" class="btn-primary w-full py-2.5 px-4 rounded-lg font-bold text-sm">Kirim Link Reset</button>
        </form>

        <div id="msg" class="msg-success hidden mt-4 p-3 rounded-lg text-sm"></div>

        <div class="text-center mt-6">
            <a href="/index.html" class="text-sm font-semibold" style="color: var(--color-accent, #4f46e5);">← Kembali ke Login</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('msg');
            const email = document.getElementById('email').value.trim();
            btn.disabled = true;
            btn.textContent = 'Mengirim...';
            msg.classList.add('hidden');
            msg.classList.remove('msg-success', 'msg-error');
            try {
                const res = await API.post('/api/auth/forgot-password', { email });
                msg.classList.add('msg-success');
                msg.textContent = res.message || 'Link reset password telah dikirim.';
                msg.classList.remove('hidden');
            } catch (err) {
                msg.classList.add('msg-error');
                msg.textContent = (err && err.message) || 'Gagal mengirim link reset.';
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kirim Link Reset';
            }
        });
    </script>
</body>
</html>
