<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs Dashboard - ANKA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .audit-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .audit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .audit-header h1 {
            font-size: 28px;
            color: #333;
            margin: 0;
        }

        .audit-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card.critical {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .filters-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #666;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        .btn-export {
            background-color: #28a745;
            color: white;
        }

        .btn-export:hover {
            background-color: #218838;
        }

        .logs-table-container {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .logs-table thead {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        .logs-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        .logs-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        .logs-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .severity-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-info {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .severity-warning {
            background-color: #fff3cd;
            color: #856404;
        }

        .severity-error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .suspicious-badge {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background-color: #e7f3ff;
            color: #004085;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 20px;
            align-items: center;
        }

        .pagination button {
            padding: 6px 10px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .pagination button:hover {
            background-color: #f8f9fa;
        }

        .pagination button.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        .no-logs {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .log-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .log-detail-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .detail-row {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            min-width: 150px;
        }

        .detail-value {
            flex: 1;
            word-break: break-word;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="audit-container">
        <div class="audit-header">
            <h1>🔐 Audit Logs Dashboard</h1>
            <div class="filter-buttons">
                <button class="btn btn-export" id="exportBtn">📥 Export CSV</button>
            </div>
        </div>

        <div class="audit-stats" id="statsContainer">
            <div class="loading">Loading statistics...</div>
        </div>

        <div class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label>Resource Type</label>
                    <select id="resourceTypeFilter">
                        <option value="">All Types</option>
                        <option value="invoice">Invoice</option>
                        <option value="user">User</option>
                        <option value="ticket">Ticket</option>
                        <option value="invoice_file">File</option>
                        <option value="invoice_rename">Rename</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Operation</label>
                    <select id="operationFilter">
                        <option value="">All Operations</option>
                        <option value="CREATE">Create</option>
                        <option value="READ">Read</option>
                        <option value="UPDATE">Update</option>
                        <option value="DELETE">Delete</option>
                        <option value="DOWNLOAD">Download</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Severity</label>
                    <select id="severityFilter">
                        <option value="">All Severities</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Start Date</label>
                    <input type="date" id="startDateFilter">
                </div>

                <div class="filter-group">
                    <label>End Date</label>
                    <input type="date" id="endDateFilter">
                </div>

                <div class="filter-group">
                    <label>Suspicious Only</label>
                    <select id="suspiciousFilter">
                        <option value="">All</option>
                        <option value="true">Suspicious</option>
                        <option value="false">Normal</option>
                    </select>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="btn btn-primary" id="filterBtn">🔍 Filter</button>
                <button class="btn btn-secondary" id="clearBtn">⟲ Clear</button>
            </div>
        </div>

        <div class="logs-table-container">
            <table class="logs-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Resource</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: #999;">
                            Loading audit logs...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="paginationContainer"></div>
    </div>

    <div class="log-detail-modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Log Details</h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let currentPage = 1;
        let currentLimit = 50;
        let totalLogs = 0;

        async function loadStats() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/audit-logs/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const stats = await response.json();

                const statsContainer = document.getElementById('statsContainer');
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Logs</div>
                        <div class="stat-value">${stats.totalLogs || 0}</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-label">Suspicious Activity</div>
                        <div class="stat-value">${stats.suspiciousActivity || 0}</div>
                    </div>
                    <div class="stat-card critical">
                        <div class="stat-label">Critical Actions</div>
                        <div class="stat-value">${stats.criticalActions || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Active Users</div>
                        <div class="stat-value">${stats.usersActive || 0}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadLogs(page = 1) {
            try {
                const token = localStorage.getItem('token');
                
                const filters = new URLSearchParams({
                    resourceType: document.getElementById('resourceTypeFilter').value,
                    operation: document.getElementById('operationFilter').value,
                    severity: document.getElementById('severityFilter').value,
                    startDate: document.getElementById('startDateFilter').value,
                    endDate: document.getElementById('endDateFilter').value,
                    isSuspicious: document.getElementById('suspiciousFilter').value,
                    limit: currentLimit,
                    offset: (page - 1) * currentLimit,
                    sortBy: 'created_at',
                    sortOrder: 'desc'
                });

                const response = await fetch(`/api/audit-logs?${filters}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                totalLogs = data.pagination.total;
                currentPage = page;
                renderLogs(data.logs);
                renderPagination(data.pagination);
            } catch (error) {
                console.error('Error loading logs:', error);
                document.getElementById('logsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px; color: #dc3545;">
                            Error loading audit logs
                        </td>
                    </tr>
                `;
            }
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logsTableBody');
            
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="no-logs">No audit logs found</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr style="cursor: pointer;" onclick="showDetail(${log.id})">
                    <td>${new Date(log.created_at).toLocaleString('id-ID')}</td>
                    <td>${log.user_email || log.user_id || 'System'}</td>
                    <td>
                        <span class="action-badge">${log.action}</span>
                    </td>
                    <td>${log.resource_name || log.resource_id || '-'}</td>
                    <td>
                        <span class="severity-badge severity-${log.severity}">
                            ${log.severity}
                        </span>
                    </td>
                    <td>
                        ${log.is_suspicious ? '<span class="suspicious-badge">⚠️ SUSPICIOUS</span>' : '✓ Normal'}
                    </td>
                    <td><small>${log.ip_address || '-'}</small></td>
                </tr>
            `).join('');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('paginationContainer');
            const totalPages = Math.ceil(pagination.total / pagination.limit);
            
            let html = `<span>Page ${currentPage} of ${totalPages}</span>`;
            
            if (currentPage > 1) {
                html += `<button onclick="loadLogs(1)">First</button>`;
                html += `<button onclick="loadLogs(${currentPage - 1})">Prev</button>`;
            }
            
            if (currentPage < totalPages) {
                html += `<button onclick="loadLogs(${currentPage + 1})">Next</button>`;
                html += `<button onclick="loadLogs(${totalPages})">Last</button>`;
            }
            
            container.innerHTML = html;
        }

        async function showDetail(logId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/audit-logs/${logId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const log = await response.json();

                const detailContent = document.getElementById('detailContent');
                detailContent.innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Timestamp</div>
                        <div class="detail-value">${new Date(log.created_at).toLocaleString('id-ID')}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">User</div>
                        <div class="detail-value">${log.user_email || log.user_id || 'System'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Action</div>
                        <div class="detail-value">${log.action}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Resource Type</div>
                        <div class="detail-value">${log.resource_type}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Resource ID</div>
                        <div class="detail-value">${log.resource_id || '-'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Operation</div>
                        <div class="detail-value">${log.operation}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status Code</div>
                        <div class="detail-value">${log.status_code}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">IP Address</div>
                        <div class="detail-value">${log.ip_address || '-'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">User Agent</div>
                        <div class="detail-value"><small>${log.user_agent || '-'}</small></div>
                    </div>
                    ${log.error_message ? `
                    <div class="detail-row">
                        <div class="detail-label">Error</div>
                        <div class="detail-value">${log.error_message}</div>
                    </div>
                    ` : ''}
                    ${log.details ? `
                    <div class="detail-row">
                        <div class="detail-label">Details</div>
                        <div class="detail-value"><pre>${JSON.stringify(log.details, null, 2)}</pre></div>
                    </div>
                    ` : ''}
                `;

                document.getElementById('detailModal').classList.add('active');
            } catch (error) {
                console.error('Error loading log details:', error);
            }
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                document.getElementById('detailModal').classList.remove('active');
            }
        });

        document.getElementById('filterBtn').addEventListener('click', () => loadLogs(1));
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('resourceTypeFilter').value = '';
            document.getElementById('operationFilter').value = '';
            document.getElementById('severityFilter').value = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            document.getElementById('suspiciousFilter').value = '';
            loadLogs(1);
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const filters = new URLSearchParams({
                resourceType: document.getElementById('resourceTypeFilter').value,
                operation: document.getElementById('operationFilter').value,
                severity: document.getElementById('severityFilter').value,
                startDate: document.getElementById('startDateFilter').value,
                endDate: document.getElementById('endDateFilter').value,
                isSuspicious: document.getElementById('suspiciousFilter').value
            });
            
            const token = localStorage.getItem('token');
            window.location.href = `/api/audit-logs/export/csv?${filters}&Authorization=${token}`;
        });

        // Load initial data
        loadStats();
        loadLogs(1);

        // Refresh stats every 60 seconds
        setInterval(loadStats, 60000);
    </script>
</body>
</html>
