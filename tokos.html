<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Toko - Pusat Arsip Anka</title>
    <!-- DARK MODE - Apply immediately to prevent flash -->
    <script>
        (function() {
            if (localStorage.getItem('dark_mode_enabled') === 'true') {
                document.documentElement.setAttribute('data-dark-mode', 'true');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        html[data-dark-mode="true"] .bg-white {
            background-color: var(--color-bg-secondary) !important;
            color: var(--color-text-primary);
        }
        
        html[data-dark-mode="true"] .bg-gray-50 {
            background-color: var(--color-bg-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-800,
        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-500,
        html[data-dark-mode="true"] .text-gray-600 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-400 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .border-gray-200,
        html[data-dark-mode="true"] .border-gray-100 {
            border-color: var(--color-border) !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-100,
        html[data-dark-mode="true"] .bg-gray-50 {
            background-color: var(--color-bg-secondary) !important;
        }
        
        html[data-dark-mode="true"] table tbody tr:hover {
            background-color: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] input[type="text"],
        html[data-dark-mode="true"] select {
            background-color: var(--color-bg-tertiary) !important;
            color: var(--color-text-primary) !important;
            border-color: var(--color-border) !important;
        }
        
        html, body {
            zoom: 0.8;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Apply dark mode if enabled -->
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <style>
        body {
            zoom: 0.8;
            transform-origin: top left;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
                <div class="px-6 py-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-gray-900">Manajemen Toko</h2>
                            <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Kelola daftar toko dan alokasi zona</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <select id="filter-zona" onchange="applyTokoFilter()" class="px-4 py-2 rounded-lg text-sm bg-white border border-gray-200 text-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="">Semua Zona</option>
                            </select>
                            <button onclick="openTokoModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition flex items-center gap-2">
                                <i class="fas fa-plus"></i>
                                Tambah Toko
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="p-6">
                <!-- Stats -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="bg-white rounded-lg p-5 shadow-md border border-gray-100">
                        <p class="text-xs text-gray-500 mb-1">Total Toko</p>
                        <p id="stat-total-tokos" class="text-2xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="bg-white rounded-lg p-5 shadow-md border border-gray-100">
                        <p class="text-xs text-gray-500 mb-1">Cakupan Zona</p>
                        <p id="stat-total-zonas" class="text-2xl font-bold text-cyan-400">0</p>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-lg shadow-md border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm" id="tokos-table">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 font-bold text-gray-700">Nama Toko</th>
                                    <th class="px-6 py-3 font-bold text-gray-700">Kode Toko</th>
                                    <th class="px-6 py-3 font-bold text-gray-700">Zona</th>
                                    <th class="px-6 py-3 text-right font-bold text-gray-700">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tokos-body">
                                <tr class="border-b border-gray-200">
                                    <td colspan="4" class="px-6 py-8 text-center text-gray-500"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toko Modal -->
    <div id="tokoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-900" id="tokoModalTitle">Tambah Toko</h2>
                <button onclick="closeTokoModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="px-6 py-4 space-y-4">
                <input type="hidden" id="editTokoId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Toko</label>
                    <input type="text" id="tokoNama" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nama Toko">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kode Toko</label>
                    <input type="text" id="tokoKode" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="toko-balaraja">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Zona</label>
                    <select id="tokoZona" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2">
                <button onclick="closeTokoModal()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">Batal</button>
                <button onclick="saveToko()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-save mr-2"></i>Simpan</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/spa-page-handler.js"></script>
    <script>
        let currentTokos = [];
        let currentZonas = [];
        let filteredTokos = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            await loadSidebar('tokos.html');
            await loadZonas();
            await loadTokos();
        });

        // Load zonas
        async function loadZonas() {
            try {
                const response = await API.get('/api/zonas');
                currentZonas = response.zonas || [];
                
                // Populate zona filters
                const filterZona = document.getElementById('filter-zona');
                const tokoZona = document.getElementById('tokoZona');
                const options = currentZonas.map(z => `<option value="${z.id}">${z.nama}</option>`).join('');
                tokoZona.innerHTML = options;
                filterZona.innerHTML = '<option value="">Semua Zona</option>' + options;
            } catch (err) {
                console.error('[Tokos] Load zonas error:', err);
            }
        }

        // Load tokos
        async function loadTokos() {
            try {
                const response = await API.get('/api/toko');
                currentTokos = response.tokos || response || [];
                filteredTokos = currentTokos;
                
                // Update stats
                document.getElementById('stat-total-tokos').textContent = currentTokos.length;
                const uniqueZonas = new Set(currentTokos.map(t => t.zona_id));
                document.getElementById('stat-total-zonas').textContent = uniqueZonas.size;
                
                // Render table
                renderTokosTable();
            } catch (err) {
                console.error('[Tokos] Load error:', err);
                alert('Gagal memuat data toko: ' + err.message);
            }
        }

        // Render tokos table
        function renderTokosTable() {
            const tbody = document.getElementById('tokos-body');
            if (filteredTokos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Tidak ada data toko</td></tr>';
                return;
            }

            tbody.innerHTML = filteredTokos.map(toko => {
                const zona = currentZonas.find(z => z.id === toko.zona_id);
                return `
                    <tr class="border-b border-gray-200 hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium text-gray-900">${toko.nama}</td>
                        <td class="px-6 py-4 text-gray-600">${toko.kode}</td>
                        <td class="px-6 py-4">${zona ? zona.nama : 'Unknown'}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="editToko('${toko.id}')" class="px-3 py-1 text-blue-600 hover:bg-blue-50 rounded transition"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteToko('${toko.id}')" class="px-3 py-1 text-red-600 hover:bg-red-50 rounded transition"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Apply toko filter
        function applyTokoFilter() {
            const zonaFilter = document.getElementById('filter-zona').value;
            filteredTokos = zonaFilter ? currentTokos.filter(t => t.zona_id == zonaFilter) : currentTokos;
            renderTokosTable();
        }

        // Open toko modal for create
        function openTokoModal() {
            document.getElementById('editTokoId').value = '';
            document.getElementById('tokoNama').value = '';
            document.getElementById('tokoKode').value = '';
            document.getElementById('tokoZona').value = '';
            document.getElementById('tokoModalTitle').textContent = 'Tambah Toko';
            document.getElementById('tokoModal').classList.remove('hidden');
        }

        // Edit toko
        function editToko(tokoId) {
            const toko = currentTokos.find(t => t.id == tokoId);
            if (!toko) return;
            
            document.getElementById('editTokoId').value = toko.id;
            document.getElementById('tokoNama').value = toko.nama;
            document.getElementById('tokoKode').value = toko.kode;
            document.getElementById('tokoZona').value = toko.zona_id;
            document.getElementById('tokoModalTitle').textContent = 'Edit Toko';
            document.getElementById('tokoModal').classList.remove('hidden');
        }

        // Save toko
        async function saveToko() {
            const id = document.getElementById('editTokoId').value;
            const nama = document.getElementById('tokoNama').value;
            const kode = document.getElementById('tokoKode').value;
            const zona_id = parseInt(document.getElementById('tokoZona').value);

            if (!nama || !kode || !zona_id) {
                alert('Semua field wajib diisi');
                return;
            }

            try {
                const data = { nama, kode, zona_id };

                if (id) {
                    await API.put(`/api/toko/${id}`, data);
                } else {
                    await API.post('/api/toko', data);
                }

                closeTokoModal();
                await loadTokos();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Delete toko
        async function deleteToko(tokoId) {
            if (!confirm('Hapus toko ini?')) return;
            
            try {
                await API.post(`/api/toko/${tokoId}`, null, { method: 'DELETE' });
                await loadTokos();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Close modal
        function closeTokoModal() {
            document.getElementById('tokoModal').classList.add('hidden');
        }
    </script>
</body>
</html>
