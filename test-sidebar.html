<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #sidebar {
            border: 2px solid red;
        }
        #main {
            margin-left: 16rem;
            padding: 2rem;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div id="sidebar"></div>
    <div id="main">
        <h1>Main Content</h1>
        <p>Sidebar should appear on the left in RED border</p>
    </div>

    <script src="js/sidebar.js?t=1735863300"></script>
    <script>
        console.log('=== SIDEBAR TEST ===');
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar');
            console.log('Sidebar element:', sidebar);
            console.log('Sidebar HTML length:', sidebar?.innerHTML?.length);
            console.log('Sidebar display:', window.getComputedStyle(sidebar).display);
            console.log('Sidebar visibility:', window.getComputedStyle(sidebar).visibility);
            console.log('Sidebar opacity:', window.getComputedStyle(sidebar).opacity);
            console.log('Sidebar position:', window.getComputedStyle(sidebar).position);
            console.log('Sidebar z-index:', window.getComputedStyle(sidebar).zIndex);
            console.log('Sidebar width:', window.getComputedStyle(sidebar).width);
            console.log('Sidebar height:', window.getComputedStyle(sidebar).height);
        }, 500);
    </script>
</body>
</html>
