        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        html[data-dark-mode="true"] .bg-white {
            background-color: var(--color-bg-secondary) !important;
            color: var(--color-text-primary);
        }
        
        html[data-dark-mode="true"] .bg-gray-50 {
            background-color: var(--color-bg-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-800,
        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-500,
        html[data-dark-mode="true"] .text-gray-600 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-400 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .border-gray-200,
        html[data-dark-mode="true"] .border-gray-100 {
            border-color: var(--color-border) !important;
        }
        
        html[data-dark-mode="true"] .border-b {
            border-color: var(--color-border) !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-100 {
            background-color: var(--color-bg-secondary) !important;
        }
        
        html[data-dark-mode="true"] table tbody tr:hover {
            background-color: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] input[type="text"],
        html[data-dark-mode="true"] input[type="email"],
        html[data-dark-mode="true"] input[type="password"],
        html[data-dark-mode="true"] select {
            background-color: var(--color-bg-tertiary) !important;
            color: var(--color-text-primary) !important;
            border-color: var(--color-border) !important;
        }
        
        html, body {
            zoom: 0.8;
        }
    </style>
</head>

    <script>
        // Prevent redeclaration when page reloads via SPA
        if (typeof currentUsers === 'undefined') {
            var currentUsers = [];
        }

        // Initialize users page
        async function initUsersPage() {
            try {
                await initAuth();
                await loadSidebar('users.html');
                await loadUsers();
            } catch (err) {
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await API.get('/api/users');
                currentUsers = response.users || [];
                
                // Update stats
                document.getElementById('stat-total-users').textContent = currentUsers.length;
                document.getElementById('stat-admin-users').textContent = currentUsers.filter(u => u.role === 'super_admin' && u.is_active).length;
                document.getElementById('stat-mod-users').textContent = currentUsers.filter(u => u.role === 'moderator' && u.is_active).length;
                
                // Render table
                renderUsersTable();
            } catch (err) {
                Notify.error('Gagal memuat data user: ' + err.message);
            }
        }

        // Render users table
        function renderUsersTable() {
            const tbody = document.getElementById('users-body');
            if (currentUsers.length === 0) {
                tbody.innerHTML = '<tr style="border-bottom:1px solid var(--color-border);"><td colspan="6" style="padding:32px 24px;text-align:center;color:var(--color-text-secondary);">Tidak ada data user</td></tr>';
                return;
            }

            tbody.innerHTML = currentUsers.map(user => {
                const roleInfo = user.role === 'super_admin' ? {label: 'Super Admin', bg: 'rgba(102,126,234,0.1)', text: '#667eea', border: 'rgba(102,126,234,0.3)'} : user.role === 'moderator' ? {label: 'Moderator', bg: 'rgba(168,85,247,0.1)', text: '#a855f7', border: 'rgba(168,85,247,0.3)'} : {label: 'Admin Zona', bg: 'rgba(59,130,246,0.1)', text: '#3b82f6', border: 'rgba(59,130,246,0.3)'};
                const statusInfo = user.is_active ? {label: 'Aktif', bg: 'rgba(34,197,94,0.1)', text: '#22c55e', border: 'rgba(34,197,94,0.3)'} : {label: 'Nonaktif', bg: 'rgba(239,68,68,0.1)', text: '#ef4444', border: 'rgba(239,68,68,0.3)'};
                
                return `
                <tr style="border-bottom:1px solid var(--color-border);transition:all 0.2s ease;cursor:pointer;" onmouseover="this.style.backgroundColor='var(--color-bg-tertiary)';this.style.boxShadow='inset 0 0 8px rgba(102,126,234,0.1)';" onmouseout="this.style.backgroundColor='transparent';this.style.boxShadow='none';">
                    <td style="padding:16px 24px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;">
                        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0;">${(user.name || user.email).charAt(0).toUpperCase()}</div>
                        ${user.name || user.email}
                    </td>
                    <td style="padding:16px 24px;color:var(--color-text-secondary);">${user.email}</td>
                    <td style="padding:16px 24px;color:var(--color-text-secondary);">${user.username || '-'}</td>
                    <td style="padding:16px 24px;">
                        <span style="display:inline-block;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;background:${roleInfo.bg};color:${roleInfo.text};border:1px solid ${roleInfo.border};letter-spacing:0.3px;">
                            ${roleInfo.label}
                        </span>
                    </td>
                    <td style="padding:16px 24px;">
                        <span style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;background:${statusInfo.bg};color:${statusInfo.text};border:1px solid ${statusInfo.border};">
                            <span style="width:6px;height:6px;border-radius:50%;background:${statusInfo.text};display:inline-block;"></span>
                            ${statusInfo.label}
                        </span>
                    </td>
                    <td style="padding:16px 24px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:8px;">
                        <button onclick="editUser('${user.id}')" style="background:rgba(59,130,246,0.1);color:#3b82f6;border:1px solid rgba(59,130,246,0.3);padding:6px 12px;border-radius:8px;cursor:pointer;transition:all 0.2s ease;font-weight:500;font-size:12px;display:flex;align-items:center;gap:4px;" onmouseover="this.style.background='rgba(59,130,246,0.2)';this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(59,130,246,0.1)';this.style.transform='translateY(0)';"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteUser('${user.id}')" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);padding:6px 12px;border-radius:8px;cursor:pointer;transition:all 0.2s ease;font-weight:500;font-size:12px;display:flex;align-items:center;gap:4px;" onmouseover="this.style.background='rgba(239,68,68,0.2)';this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(239,68,68,0.1)';this.style.transform='translateY(0)';"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `}).join('');
        }

        // Open user modal for create
        function openUserModal() {
            document.getElementById('editUserId').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userUsername').value = '';
            document.getElementById('userName').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRole').value = 'moderator';
            document.getElementById('userZona').value = '';
            document.getElementById('userActive').checked = true;
            document.getElementById('userModalTitle').innerHTML = '<i class="fas fa-plus" style="color:#667eea;"></i>Tambah User';
            document.getElementById('userPassword').required = true;
            document.getElementById('zonaSelectContainer').style.display = 'none';
            document.getElementById('userModal').style.display = 'flex';
            // Trigger animation
            setTimeout(() => document.getElementById('userModal').style.animation = 'fadeIn 0.3s ease', 0);
        }

        // Edit user
        function editUser(userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userUsername').value = user.username || '';
            document.getElementById('userName').value = user.name || '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRole').value = user.role;
            document.getElementById('userZona').value = user.zona_id || '';
            document.getElementById('userActive').checked = user.is_active;
            document.getElementById('userModalTitle').innerHTML = '<i class="fas fa-edit" style="color:#667eea;"></i>Edit User';
            document.getElementById('userPassword').required = false;
            document.getElementById('userPassword').placeholder = 'Kosongkan untuk tidak mengubah password';
            
            // Show zona selector if admin_zona
            if (user.role === 'admin_zona') {
                document.getElementById('zonaSelectContainer').style.display = 'flex';
            } else {
                document.getElementById('zonaSelectContainer').style.display = 'none';
            }
            
            document.getElementById('userModal').style.display = 'flex';
            // Trigger animation
            setTimeout(() => document.getElementById('userModal').style.animation = 'slideUp 0.3s cubic-bezier(0.4,0,0.2,1)', 0);
        }

        // Handle role change to show/hide zona selector
        function handleRoleChange() {
            const role = document.getElementById('userRole').value;
            const zonaContainer = document.getElementById('zonaSelectContainer');
            
            if (role === 'admin_zona') {
                zonaContainer.style.display = 'flex';
                // Load zonas if not loaded
                if (document.getElementById('userZona').options.length <= 1) {
                    loadZonasForSelect();
                }
            } else {
                zonaContainer.style.display = 'none';
                document.getElementById('userZona').value = '';
            }
        }

        // Load zonas for select dropdown
        async function loadZonasForSelect() {
            try {
                const response = await API.get('/api/zonas');
                const zonas = response.zonas || [];
                const zonaSelect = document.getElementById('userZona');
                
                // Clear existing options except first
                while (zonaSelect.options.length > 1) {
                    zonaSelect.remove(1);
                }
                
                // Add zona options
                zonas.forEach(zona => {
                    const option = document.createElement('option');
                    option.value = zona.id;
                    option.textContent = zona.nama || `Zona ${zona.id}`;
                    zonaSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Error loading zonas:', err);
                Notify.error('Gagal memuat data zona');
            }
        }

        // Save user
        async function saveUser() {
            const id = document.getElementById('editUserId').value;
            const email = document.getElementById('userEmail').value.trim();
            const username = document.getElementById('userUsername').value.trim();
            const name = document.getElementById('userName').value.trim();
            const password = document.getElementById('userPassword').value;
            const role = document.getElementById('userRole').value;
            const zona_id = document.getElementById('userZona').value;
            const is_active = document.getElementById('userActive').checked;

            // Validation
            if (!email || !name) {
                Notify.error('Email dan Nama wajib diisi');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                Notify.error('Format email tidak valid. Contoh: user@example.com');
                return;
            }

            // Username validation (optional but must follow format if provided)
            if (username) {
                const usernameRegex = /^[a-zA-Z0-9_-]{3,20}$/;
                if (!usernameRegex.test(username)) {
                    Notify.error('Username harus 3-20 karakter, hanya huruf, angka, underscore, dash.\nContoh: john_doe, user-123');
                    return;
                }
            }

            // Role validation
            if (!role || !['super_admin', 'moderator', 'admin_zona'].includes(role)) {
                Notify.error('Role tidak valid');
                return;
            }

            // Zona validation for admin_zona
            if (role === 'admin_zona' && !zona_id) {
                Notify.error('Zona wajib dipilih untuk role Admin Zona');
                return;
            }

            try {
                const data = { email, name, role, is_active };
                if (username) data.username = username;
                if (password) data.password = password;
                if (role === 'admin_zona') data.zona_id = parseInt(zona_id);

                console.log('[saveUser] Sending request:', id ? 'UPDATE' : 'CREATE', data);

                if (id) {
                    await API.put(`/api/users/${id}`, data);
                } else {
                    if (!password) {
                        Notify.error('Password wajib diisi untuk user baru');
                        return;
                    }
                    await API.post('/api/users', data);
                }

                closeUserModal();
                await loadUsers();
                Notify.success(id ? 'User berhasil diupdate!' : 'User berhasil ditambahkan!');
            } catch (err) {
                console.error('[saveUser] Error:', err);
                Notify.error('Error: ' + err.message);
            }
        }

        // Delete user
        async function deleteUser(userId) {
            Notify.confirmDelete('Hapus User', 'Apakah Anda yakin ingin menghapus user ini?', async () => {
                try {
                    await API.post(`/api/users/${userId}`, null, { method: 'DELETE' });
                    await loadUsers();
                } catch (err) {
                    Notify.error('Error: ' + err.message);
                }
            });
        }

        // Close modal
        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        // Also support DOMContentLoaded for direct page load
        document.addEventListener('DOMContentLoaded', initUsersPage);

        // Listen for profile updates from other pages (e.g., admin zona profile changes)
        window.addEventListener('profileUpdated', async () => {
            console.log('Profile update detected, refreshing users table...');
            if (typeof loadUsers === 'function') {
                await loadUsers();
                console.log('Users table refreshed');
            }
        });
    </script>
    <script>
        if (typeof initUsersPage === 'function') {
            initUsersPage();
        }
    </script>
</body>
</html>
