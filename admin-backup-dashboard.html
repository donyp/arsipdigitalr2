<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Dashboard | Arsip Digital ANKA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/unified-header.css">
    <link rel="stylesheet" href="css/color-vars.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 30px;
            margin-left: 16rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 i {
            font-size: 40px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        html[data-dark-mode="true"] .stat-card {
            background: var(--color-bg-secondary);
            border-color: var(--color-border);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            font-size: 11px;
            color: #8b92b0;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .stat-meta {
            font-size: 13px;
            color: #9ba4b5;
            line-height: 1.6;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        html[data-dark-mode="true"] .tabs {
            background: var(--color-bg-secondary);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            color: #9ba4b5;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab.active {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .tab:hover {
            color: #667eea;
        }

        /* Table Container */
        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            animation: slideUp 0.5s ease-out;
        }

        html[data-dark-mode="true"] .table-container {
            background: var(--color-bg-secondary);
            border-color: var(--color-border);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 800;
            color: #667eea;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        td {
            padding: 18px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        tbody tr {
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: rgba(102, 126, 234, 0.03);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .badge-success:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .badge-failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .badge-failed:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .badge-pending:hover {
            background: rgba(245, 158, 11, 0.25);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            padding: 8px 12px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .action-btn.danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .action-btn.danger:hover {
            background: #ef4444;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html[data-dark-mode="true"] .modal-content {
            background: var(--color-bg-secondary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.06);
        }

        html[data-dark-mode="true"] .modal-header {
            border-bottom-color: var(--color-border);
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #9ba4b5;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: #667eea;
            transform: rotate(90deg);
        }

        .modal-body {
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 14px;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: white;
            color: var(--color-text-primary);
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 500;
        }

        html[data-dark-mode="true"] .form-control {
            background: var(--color-bg-primary);
            border-color: var(--color-border);
            color: var(--color-text-primary);
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 40px;
            color: #9ba4b5;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Alert */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 2px solid #10b981;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 2px solid #f59e0b;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }

        .alert i {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin-left: 0;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .modal-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar (rendered by js/sidebar.js) -->
    <aside id="sidebar" class="sidebar"></aside>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-cloud-upload-alt"></i>
                Backup Manager
            </h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="triggerManualBackup()">
                    <i class="fas fa-circle-plus"></i>
                    Buat Backup
                </button>
                <button class="btn btn-secondary" onclick="refreshData()">
                    <i class="fas fa-rotate-right"></i>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-database"></i> Total Backups</div>
                <div class="stat-value" id="totalBackups">-</div>
                <div class="stat-meta">✓ Success: <span id="successCount">-</span> | ✗ Failed: <span id="failedCount">-</span></div>
            </div>

            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-hdd"></i> Database</div>
                <div class="stat-value" id="dbBackupCount">-</div>
                <div class="stat-meta">Last backup: <span id="lastDbBackup">-</span></div>
            </div>

            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-folder"></i> Files</div>
                <div class="stat-value" id="fileBackupCount">-</div>
                <div class="stat-meta">Last backup: <span id="lastFileBackup">-</span></div>
            </div>

            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-gears"></i> Config</div>
                <div class="stat-value" id="configBackupCount">-</div>
                <div class="stat-meta">Last backup: <span id="lastConfigBackup">-</span></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('history')">
                <i class="fas fa-history"></i> History
            </button>
            <button class="tab" onclick="switchTab('config')">
                <i class="fas fa-sliders"></i> Configuration
            </button>
        </div>

        <!-- Tab: History -->
        <div id="history-tab" class="tab-content" style="display: block;">
            <div id="historyContainer" class="table-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading backup history...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Configuration -->
        <div id="config-tab" class="tab-content" style="display: none;">
            <div id="configContainer" class="table-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading backup configuration...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Manual Backup -->
    <div id="backupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-circle-plus" style="margin-right: 12px;"></i>Buat Backup Baru</h2>
                <button class="modal-close" onclick="closeModal('backupModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Pilih Tipe Backup</label>
                    <select id="backupType" class="form-control">
                        <option value="">📦 Semua (Database + Files + Config)</option>
                        <option value="database">💾 Database Only</option>
                        <option value="files">📁 Files Only</option>
                        <option value="config">⚙️ Config Only</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('backupModal')">Batal</button>
                <button class="btn btn-primary" onclick="confirmBackup()">
                    <i class="fas fa-check"></i> Mulai Backup
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Restore -->
    <div id="restoreModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-undo" style="margin-right: 12px;"></i>Restore Backup</h2>
                <button class="modal-close" onclick="closeModal('restoreModal')">&times;</button>
            </div>
            <div class="modal-body" id="restoreModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('restoreModal')">Batal</button>
                <button class="btn btn-danger" onclick="confirmRestore()">
                    <i class="fas fa-check"></i> Restore
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js?t=1792067064.55694"></script>
    <script src="js/backup-admin.js"></script>
    
    <!-- Force sidebar initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.initSidebar) {
                window.initSidebar();
            }
        });
    </script>
</body>
</html>
