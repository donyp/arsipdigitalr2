# Nginx Configuration for Arsip Anka
# Copy to: /etc/nginx/sites-available/arsip-anka
# Enable: sudo ln -s /etc/nginx/sites-available/arsip-anka /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream arsip_backend {
    # Round-robin load balancing across PM2 cluster instances
    server localhost:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arsipdigitalanka.cloud www.arsipdigitalanka.cloud;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arsipdigitalanka.cloud www.arsipdigitalanka.cloud;
    
    # ============================================================
    # SSL Configuration (Let's Encrypt)
    # ============================================================
    ssl_certificate /etc/letsencrypt/live/arsipdigitalanka.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsipdigitalanka.cloud/privkey.pem;
    
    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ============================================================
    # Logging
    # ============================================================
    access_log /var/log/nginx/arsip-access.log combined;
    error_log /var/log/nginx/arsip-error.log warn;
    
    # ============================================================
    # Performance Settings
    # ============================================================
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json image/svg+xml;
    gzip_disable "msie6";
    
    # File upload size
    client_max_body_size 500M;
    
    # Buffer settings
    client_body_buffer_size 128k;
    client_max_body_size 500m;
    
    # ============================================================
    # Proxy Settings
    # ============================================================
    
    # Main API proxy
    location / {
        proxy_pass http://arsip_backend;
        
        # HTTP version (1.1 for keepalive)
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings (for long file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
        proxy_busy_buffers_size 8k;
        
        # Error handling
        proxy_intercept_errors off;
    }
    
    # ============================================================
    # WebSocket Support
    # ============================================================
    location /ws {
        proxy_pass http://arsip_backend;
        
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket timeout (long connection)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # ============================================================
    # Static Files (if any)
    # ============================================================
    location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://arsip_backend;
        
        # Cache static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        access_log off;
    }
    
    # ============================================================
    # Health Check Endpoints (no logging)
    # ============================================================
    location ~ ^/api/(health|phases/health)$ {
        proxy_pass http://arsip_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        access_log off;
    }
    
    # ============================================================
    # Security: Block access to sensitive files
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================================
    # Metrics and Monitoring (optional)
    # ============================================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}

