            document.addEventListener('DOMContentLoaded', async () => {
                
                // Get ticket ID from URL
                const params = new URLSearchParams(window.location.search);
                ticketId = params.get('id');
                
                if (!ticketId) {
                    document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: No ticket ID provided</div>';
                    return;
                }

                // Initialize auth
                await initAuth();
                
                if (!currentUser) {
                    document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: Not authenticated</div>';
                    return;
                }

                // Check if user is moderator/super_admin
                if (currentUser.role !== 'moderator' && currentUser.role !== 'super_admin') {
                    // Redirect to customer detail page
                    window.location.href = `/support-ticket-detail.html?id=${ticketId}`;
                    return;
            }

            // Load ticket
            await loadTicketDetail();
        });

        async function loadTicketDetail() {
            try {
                
                const token = localStorage.getItem('jwt_token');
                
                // Load ticket dan zonas secara parallel
                const [ticketResponse, zonaResponse] = await Promise.all([
                    fetch(`/api/support/tickets/${ticketId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch('/api/zonas', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);

                if (!ticketResponse.ok) {
                    throw new Error(`HTTP ${ticketResponse.status}`);
                }

                const data = await ticketResponse.json();
                ticketData = data.ticket;
                
                
                // Process zona data jika tersedia
                if (zonaResponse.ok) {
                    const zonaData = await zonaResponse.json();
                    const zonas = zonaData.zonas || zonaData.data || [];
                    const zona = zonas.find(z => z.id === ticketData.zona_id);
                    if (zona) {
                        ticketData.zona_name = zona.nama;
                    }
                }
                
                renderTicketDetail();
            } catch (error) {
                document.getElementById('messagesContainer').innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ef4444;">
                        <div style="margin-bottom: 12px;">
                            <i class="fas fa-exclamation-circle" style="font-size: 24px;"></i>
                        </div>
                        <div>Error: ${error.message}</div>
                    </div>
                `;
            }
        }


        function renderTicketDetail() {
            // Set header
            document.getElementById('ticketNumber').textContent = ticketData.ticket_number;
            document.getElementById('ticketSubject').textContent = ticketData.subject;
            
            // Get zona name - display with clean format
            let zonaDisplay = 'N/A';
            if (ticketData.zona_name) {
                const match = ticketData.zona_name.match(/(\d+)/);
                if (match) {
                    zonaDisplay = 'Zona ' + (match[1].replace(/^0+/, '') || '0');
                } else {
                    zonaDisplay = ticketData.zona_name;
                }
            }
            document.getElementById('ticketZona').textContent = `${zonaDisplay}`;

            // Set status dropdown with current status
            const statusSelect = document.getElementById('statusSelect');
            statusSelect.value = ticketData.status;

            // Set sidebar info
            document.getElementById('sidebarCreatedBy').textContent = ticketData.created_by_username || 'N/A';
            document.getElementById('sidebarCreated').textContent = formatDateTimeWIB(ticketData.created_at);
            document.getElementById('sidebarPriority').textContent = ticketData.priority || 'Medium';
            document.getElementById('sidebarCategory').textContent = ticketData.category || '-';
            document.getElementById('sidebarTotalMessages').textContent = (ticketData.messages || []).length + 1;
            document.getElementById('sidebarLastReply').textContent = getLastReplyTime(ticketData);

            // Render messages
            renderMessages();
        }

        function renderMessages() {
            let html = '';
            
            // Original message from customer
            if (ticketData.description) {
                html += `
                    <div class="message-item">
                        <div class="message-avatar customer">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header-row">
                                <span class="message-author">${ticketData.created_by_username || 'Toko'}</span>
                                <span class="message-role">TOKO</span>
                                <span class="message-time">${formatDateTimeWIB(ticketData.created_at)}</span>
                            </div>
                            <div class="message-body">${escapeHtml(ticketData.description)}</div>
                        </div>
                    </div>
                `;
            }

            const messages = ticketData.messages || [];

            if (messages.length === 0) {
                html += `
                    <div class="empty-state" style="padding: 40px 24px; border-top: 1px solid #f3f4f6;">
                        <div class="empty-state-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <div style="font-size: 13px;">Tidak ada balasan</div>
                    </div>
                `;
            } else {
                html += messages.map(msg => {
                    const isSupport = msg.user_id !== ticketData.user_id;
                    const authorName = isSupport ? 'Tim Support' : (msg.user_name || 'Toko');
                    
                    return `
                        <div class="message-item">
                            <div class="message-avatar ${isSupport ? 'support' : 'customer'}">
                                ${isSupport ? '<i class="fas fa-headset"></i>' : '<i class="fas fa-user"></i>'}
                            </div>
                            <div class="message-content">
                                <div class="message-header-row">
                                    <span class="message-author">${authorName}</span>
                                    <span class="message-role">${isSupport ? 'SUPPORT' : 'TOKO'}</span>
                                    <span class="message-time">${formatDateTimeWIB(msg.created_at)}</span>
                                    <button class="message-delete-btn" onclick="deleteMessage('${msg.id}')" title="Hapus pesan"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                <div class="message-body">${escapeHtml(msg.message)}</div>
                                ${msg.attachments && msg.attachments.length > 0 ? `
                                    <div class="message-attachments">
                                        ${msg.attachments.map(att => `
                                            <div class="attachment-item">
                                                <span class="attachment-icon"><i class="fas fa-file"></i></span>
                                                <a href="/api/support/tickets/${ticketId}/download/${att.id}" target="_blank">
                                                    ${att.file_name}
                                                </a>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('messagesContainer').innerHTML = html;
        }

        function getIndonesianMonth(monthIndex) {
            const months = [
                'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];
            return months[monthIndex] || '';
        }

        function formatDateTimeWIB(dateString) {
            if (!dateString) return '-';
            
            try {
                // Parse the input string. If it doesn't have timezone info, treat as UTC
                let date;
                
                // Check if the string has timezone info
                const hasTimezone = /[Z+\-]\d{2}:?\d{2}$/.test(dateString) || dateString.endsWith('Z');
                
                if (!hasTimezone) {
                    // No timezone info - treat as UTC by adding Z
                    const normalizedString = dateString.replace(' ', 'T');
                    date = new Date(normalizedString + 'Z');
                } else {
                    // Has timezone info, parse as-is
                    date = new Date(dateString);
                }
                
                if (isNaN(date.getTime())) {
                    return '-';
                }
                
                
                // Calculate WIB (UTC+7)
                const wibTime = new Date(date.getTime() + (7 * 60 * 60 * 1000));
                
                const year = wibTime.getUTCFullYear();
                const month = getIndonesianMonth(wibTime.getUTCMonth());
                const day = wibTime.getUTCDate();
                const hours = String(wibTime.getUTCHours()).padStart(2, '0');
                const minutes = String(wibTime.getUTCMinutes()).padStart(2, '0');
                const seconds = String(wibTime.getUTCSeconds()).padStart(2, '0');
                
                const formatted = `${day} ${month} ${year}, ${hours}:${minutes}:${seconds}`;
                
                return formatted;
            } catch (e) {
                return '-';
            }
        }

        function getLastReplyTime(ticket) {
            const messages = ticket.messages || [];
            if (messages.length === 0) return '-';
            const lastMsg = messages[messages.length - 1];
            return formatDateTimeWIB(lastMsg.created_at);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function updateStatus() {
            try {
                const newStatus = document.getElementById('statusSelect').value;
                const token = localStorage.getItem('jwt_token');

                const response = await fetch(`/api/support/tickets/${ticketId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    throw new Error('Failed to update status');
                }

                const data = await response.json();
                ticketData.status = newStatus;
                
                // Show success message
                Notify.success('Status tiket berhasil diperbarui');
                
                // If status changed to Resolved or Closed, redirect to dashboard after 2 seconds
                if (['Resolved', 'Closed'].includes(newStatus)) {
                    setTimeout(() => {
                        window.location.href = '/support-dashboard.html';
                    }, 1500);
                }
            } catch (error) {
                Notify.error('Error: ' + error.message);
                // Revert dropdown
                await loadTicketDetail();
            }
        }

        async function deleteMessage(messageId) {
            const result = await Swal.fire({
                title: 'Hapus Pesan?',
                text: 'Pesan yang dihapus tidak dapat dikembalikan',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Hapus',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280'
            });
            
            if (!result.isConfirmed) return;
            
            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/support/tickets/${ticketId}/messages/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Gagal menghapus pesan');
                
                await Swal.fire({
                    title: 'Berhasil!',
                    text: 'Pesan berhasil dihapus',
                    icon: 'success',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#10b981'
                });
                
                await loadTicketDetail();
            } catch (error) {
                await Swal.fire({
                    title: 'Error',
                    text: error.message,
                    icon: 'error',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#ef4444'
                });
            }
        }

        async function sendReply() {
            try {
                const message = document.getElementById('replyMessage').value.trim();
                
                if (!message) {
                    Notify.error('Pesan tidak boleh kosong');
                    return;
                }

                const btnSend = document.getElementById('btnSendReply');
                const statusDiv = document.getElementById('replyStatus');

                btnSend.disabled = true;
                statusDiv.style.display = 'block';
                statusDiv.textContent = 'Mengirim...';
                statusDiv.style.color = '#6b7280';
                statusDiv.classList.add('loading');

                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/support/tickets/${ticketId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to send reply');
                }

                statusDiv.textContent = 'Balasan terkirim!';
                statusDiv.style.color = '#10b981';
                statusDiv.classList.remove('loading');
                document.getElementById('replyMessage').value = '';

                // Reload ticket after 1 second
                setTimeout(() => {
                    loadTicketDetail();
                    btnSend.disabled = false;
                    statusDiv.style.display = 'none';
                }, 1000);
            } catch (error) {
                const statusDiv = document.getElementById('replyStatus');
                statusDiv.textContent = 'Error: ' + error.message;
                statusDiv.style.color = '#ef4444';
                statusDiv.style.display = 'block';
                statusDiv.classList.remove('loading');
                document.getElementById('btnSendReply').disabled = false;
            }
        }
        function reloadTicket() {
            loadTicketDetail();
        }
        
        } // End if (typeof window._supportTicketDetailModeratorLoaded === 'undefined')
    </script>
