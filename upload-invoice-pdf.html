<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF Invoice - Pusat Arsip Anka</title>
    <!-- DARK MODE - Apply immediately to prevent flash -->
    <script>
        (function() {
            if (localStorage.getItem('dark_mode_enabled') === 'true') {
                document.documentElement.setAttribute('data-dark-mode', 'true');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        html[data-dark-mode="true"] .bg-white {
            background-color: var(--color-bg-secondary) !important;
            color: var(--color-text-primary);
        }
        
        html[data-dark-mode="true"] .bg-gray-50 {
            background-color: var(--color-bg-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-800,
        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-500,
        html[data-dark-mode="true"] .text-gray-600 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .border-gray-200,
        html[data-dark-mode="true"] .border-gray-100 {
            border-color: var(--color-border) !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-100 {
            background-color: var(--color-bg-secondary) !important;
        }
        
        html[data-dark-mode="true"] .bg-yellow-50 {
            background-color: var(--color-bg-secondary) !important;
        }
        
        html[data-dark-mode="true"] .border-yellow-200 {
            border-color: #f59e0b !important;
        }
        
        html[data-dark-mode="true"] .text-yellow-800 {
            color: #fbbf24 !important;
        }
        
        html[data-dark-mode="true"] .bg-red-600 {
            background-color: #e74c3c !important;
        }
        
        html[data-dark-mode="true"] .hover\:bg-red-700:hover {
            background-color: #c0392b !important;
        }
        
        html[data-dark-mode="true"] .text-red-100 {
            color: #ffcccc !important;
        }
        
        html[data-dark-mode="true"] .text-red-600 {
            color: #e74c3c !important;
        }
        
        html[data-dark-mode="true"] #dropZone {
            background: var(--color-bg-secondary) !important;
            border-color: #e74c3c !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-400 {
            background-color: #6b7280 !important;
        }
        
        html[data-dark-mode="true"] .hover\:bg-gray-500:hover {
            background-color: #4b5563 !important;
        }
        
        html[data-dark-mode="true"] .bg-f8f9fa {
            background-color: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] .text-green-600 {
            color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] .text-e74c3c {
            color: #e74c3c !important;
        }
        
        /* Stats cards dark mode */
        html[data-dark-mode="true"] #stats div[style*="background: #f8f9fa"] {
            background: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] #stats div[style*="background: #f8f9fa"] div[style*="font-size: 28px"] {
            color: inherit !important;
        }
        
        html[data-dark-mode="true"] #totalFiles {
            color: #60a5fa !important;
        }
        
        html[data-dark-mode="true"] #validFiles {
            color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] #invalidFiles {
            color: #ef5350 !important;
        }
        
        html[data-dark-mode="true"] #stats div[style*="color: #7f8c8d"] {
            color: var(--color-text-secondary) !important;
        }
        
        /* Validating spinner dark mode */
        html[data-dark-mode="true"] #validating {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] #validating p {
            color: var(--color-text-primary) !important;
        }
        
        /* File list items dark mode */
        html[data-dark-mode="true"] #filesContainer div[style*="background: #f8f9fa"] {
            background: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] #filesContainer div[style*="color: #2c3e50"] {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] #filesContainer div[style*="color: #7f8c8d"] {
            color: var(--color-text-secondary) !important;
        }
        
        /* Files list dark mode */
        html[data-dark-mode="true"] .file-item-status {
            background: var(--color-bg-tertiary) !important;
            color: var(--color-text-primary) !important;
        }
        
        /* Valid/Invalid badges - target by parent class */
        html[data-dark-mode="true"] .file-item.valid .file-item-status {
            background: rgba(16, 185, 129, 0.2) !important;
            color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] .file-item.invalid .file-item-status {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef5350 !important;
        }

        .gradient-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #ccc;
            background: #f9f9f9;
            animation: slideUp 0.3s ease-out;
        }

        html[data-dark-mode="true"] .file-item {
            background: var(--color-bg-secondary) !important;
        }

        .file-item.valid {
            border-left-color: #27ae60;
            background: #f0fdf4;
        }

        html[data-dark-mode="true"] .file-item.valid {
            background: var(--color-bg-tertiary) !important;
        }

        .file-item.invalid {
            border-left-color: #e74c3c;
            background: #fef2f2;
        }

        html[data-dark-mode="true"] .file-item.invalid {
            background: var(--color-bg-secondary) !important;
        }

        .file-item-icon {
            font-size: 20px;
            font-weight: bold;
            margin-right: 12px;
            min-width: 30px;
            text-align: center;
        }

        .file-item.valid .file-item-icon {
            color: #27ae60;
        }

        .file-item.invalid .file-item-icon {
            color: #e74c3c;
        }

        .file-item-name {
            font-weight: 600;
            color: #2c3e50;
            word-break: break-word;
        }

        html[data-dark-mode="true"] .file-item-name {
            color: var(--color-text-primary) !important;
        }

        .file-item-faktur {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        html[data-dark-mode="true"] .file-item-faktur {
            color: var(--color-text-secondary) !important;
        }

        .file-item-status {
            margin-left: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .file-item.valid .file-item-status {
            background: #d4edda;
            color: #27ae60;
        }

        .file-item.invalid .file-item-status {
            background: #f8d7da;
            color: #e74c3c;
        }
        
        html[data-dark-mode="true"] .file-item.valid .file-item-status {
            background: #064e3b !important;
            color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] .file-item.invalid .file-item-status {
            background: #7f1d1d !important;
            color: #fca5a5 !important;
        }

        .delete-btn {
            margin-left: 10px;
            padding: 6px 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .filesList.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Apply dark mode if enabled -->
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <style>
        #app {
            width: 100%;
        }
        #dropZone.drag-over {
            border-color: #e74c3c !important;
            background-color: #fde8e8 !important;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 20rem; width: calc(100% - 20rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="gradient-header text-white sticky top-0 z-30 shadow-lg">
                <div class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2 rounded-lg">
                            <i class="fas fa-file-pdf text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold">Upload PDF Invoice</h1>
                            <p class="text-red-100 text-xs mt-0.5">Upload file PDF invoice untuk disimpan</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="p-4">
                <!-- Info Box -->
                <!-- Removed for compact layout -->

                <!-- Upload Card -->
                <div class="bg-white rounded-lg shadow-md p-5 mb-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt text-red-600"></i>
                        Drag & Drop PDF Invoice
                    </h2>

                    <!-- Drop Zone -->
                    <div id="dropZone" style="border: 2px dashed #e74c3c; border-radius: 12px; padding: 40px 30px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fff5f3;">
                        <i class="fas fa-file-pdf" style="font-size: 48px; color: #e74c3c; margin-bottom: 12px; display: block;"></i>
                        <p style="margin: 0 0 12px 0; color: #2c3e50; font-weight: 600; font-size: 14px;">Drag & drop multiple PDF di sini</p>
                        <span style="font-size: 12px; color: #7f8c8d;">atau klik untuk memilih file</span>
                    </div>

                    <!-- Validating Spinner -->
                    <div id="validating" style="display: none; text-align: center; padding: 25px;">
                        <div style="font-size: 36px; margin-bottom: 10px;">⏳</div>
                        <p style="color: #2c3e50; font-weight: 600; margin-bottom: 8px; font-size: 13px;">Validating Files...</p>
                        <p style="color: #7f8c8d; font-size: 12px;">Please wait while we check your files</p>
                    </div>

                    <input type="file" id="fileInput" accept=".pdf" multiple style="display: none;">

                    <!-- Stats -->
                    <div id="stats" style="display: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0;">
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #2c3e50;" id="totalFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Total File</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #27ae60;" id="validFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Valid ✓</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #e74c3c;" id="invalidFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Invalid ✗</div>
                        </div>
                    </div>

                    <!-- Files List -->
                    <div id="filesList" style="display: none; margin-top: 20px;">
                        <h4 style="color: #2c3e50; margin-bottom: 12px; font-size: 14px; font-weight: 600;">File Selection:</h4>
                        <div id="filesContainer"></div>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                        <button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-5 rounded-lg transition text-sm" onclick="resetUpload()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                        <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-5 rounded-lg transition text-sm" id="btnUpload" disabled>
                            <i class="fas fa-upload"></i> Upload PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/spa-page-handler.js"></script>
    <script src="js/upload-invoice-pdf.js"></script>
</body>
</html>>
