<!DOCTYPE html>
<html>
<head>
    <title>Debug Piutang</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Debug Console</h1>
    <div id="log" style="border: 1px solid black; padding: 10px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
    
    <script>
        const logEl = document.getElementById('log');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addLog(type, args) {
            const msg = Array.from(args).map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            logEl.innerHTML += `<div style="color: ${type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black'};">[${type}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        console.log = function(...args) { addLog('log', args); originalLog.apply(console, args); };
        console.error = function(...args) { addLog('error', args); originalError.apply(console, args); };
        console.warn = function(...args) { addLog('warn', args); originalWarn.apply(console, args); };
        
    </script>
    
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        
        (async () => {
            try {
                const user = await initAuth();
            } catch (err) {
            }
        })();
    </script>
</body>
</html>
