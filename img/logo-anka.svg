<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- ANKA Text Logo -->
  <g id="anka-logo">
    <!-- Red Triangle - A -->
    <polygon points="410,20 495,130 325,130" fill="#C41E3A"/>
    
    <!-- Navy Blue Letters: ANKA -->
    <!-- A -->
    <path d="M 0 380 L 80 80 L 160 380 M 30 250 L 130 250" fill="none" stroke="#2C3E7F" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- N -->
    <path d="M 200 380 L 200 80 L 360 380 L 360 80" stroke="#2C3E7F" stroke-width="35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- K -->
    <path d="M 400 80 L 400 380 M 560 80 L 400 230 L 560 380" stroke="#2C3E7F" stroke-width="35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- A -->
    <path d="M 600 380 L 680 80 L 760 380 M 630 250 L 730 250" fill="none" stroke="#2C3E7F" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- ® symbol -->
    <circle cx="850" cy="130" r="30" stroke="#2C3E7F" stroke-width="3" fill="none"/>
    <text x="840" y="140" font-size="40" font-weight="bold" fill="#2C3E7F">®</text>
  </g>
</svg>
