<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Invoice - Pusat Arsip Anka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(52, 152, 219, 0.15);
        }

        .whatsapp-panel { 
            background: #ecf0f1; 
            border-left: 4px solid #25d366; 
            padding: 20px; 
            border-radius: 6px; 
            margin-top: 20px; 
        }
        
        .whatsapp-panel h3 { 
            margin-top: 0;
            color: #25d366;
        }
        
        .message-preview { 
            background: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 15px; 
            border-left: 3px solid #25d366; 
            font-size: 13px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            word-break: break-word; 
            font-family: monospace;
        }
        
        .copy-btn { 
            background: #25d366; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            margin-top: 10px;
        }
        
        .copy-btn:hover { background: #1fa857; }
    </style>
</head>
<body class="bg-gray-50">
    <style>
        body {
            zoom: 0.8;
            transform-origin: top left;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="gradient-header text-white sticky top-0 z-30 shadow-lg">
                <div class="px-6 py-8">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-3 rounded-lg">
                            <i class="fas fa-file-invoice text-2xl"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold">Upload Invoice</h1>
                            <p class="text-blue-100 text-sm mt-1">Upload invoice individual dan otomatis generate pesan WhatsApp untuk zona</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="p-6 max-w-4xl mx-auto">
                <!-- Info Box -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <p class="text-blue-800 text-sm">
                        <i class="fas fa-info-circle mr-2"></i>
                        <strong>Cara Kerja:</strong> Isi form invoice dan upload file PDF. Sistem akan otomatis generate pesan WhatsApp untuk zona.
                    </p>
                </div>

                <!-- Upload Form -->
                <div class="card-hover bg-white rounded-lg shadow-md p-8 mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-file-pdf text-blue-600"></i>
                        Form Upload Invoice
                    </h2>

                    <form id="invoiceForm" class="space-y-6">
                        <!-- Zona Selection -->
                        <div>
                            <label for="zona" class="block text-sm font-semibold text-gray-700 mb-2">Pilih Zona *</label>
                            <select id="zona" required onchange="loadZonaData()" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                                <option value="">-- Pilih Zona --</option>
                            </select>
                        </div>

                        <!-- Tipe Invoice -->
                        <div>
                            <label for="tipe" class="block text-sm font-semibold text-gray-700 mb-2">Tipe Invoice (PPN/PPH) *</label>
                            <select id="tipe" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                                <option value="">-- Pilih Tipe --</option>
                                <option value="PPN">PPN</option>
                                <option value="PPH">PPH</option>
                                <option value="PPN23">PPN 23%</option>
                                <option value="PPH21">PPH 21%</option>
                                <option value="PPH22">PPH 22%</option>
                                <option value="PPH23">PPH 23%</option>
                                <option value="PPH25">PPH 25%</option>
                                <option value="PPH26">PPH 26%</option>
                            </select>
                        </div>

                        <!-- Nama Konsumen -->
                        <div>
                            <label for="konsumen" class="block text-sm font-semibold text-gray-700 mb-2">Nama Konsumen/Customer *</label>
                            <input type="text" id="konsumen" placeholder="Contoh: PT ABC, CILEDUG, dll" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                        </div>

                        <!-- Nominal -->
                        <div>
                            <label for="nominal" class="block text-sm font-semibold text-gray-700 mb-2">Nominal (Rp) *</label>
                            <input type="number" id="nominal" placeholder="Contoh: 2930223" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                        </div>

                        <!-- File Input with Drag & Drop -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Pilih atau Drag File Invoice (PDF) *</label>
                            <div id="dropZone" class="relative border-2 border-dashed border-gray-300 rounded-lg p-8 text-center bg-gray-50 hover:bg-gray-100 hover:border-blue-400 transition cursor-pointer" style="min-height: 150px; display: flex; align-items: center; justify-content: center;">
                                <input type="file" id="fileInput" accept=".pdf" required style="display: none;">
                                <div id="dropZoneContent">
                                    <i class="fas fa-cloud-upload-alt text-blue-400 text-4xl mb-3 block"></i>
                                    <p class="text-gray-700 font-semibold mb-1">Drag & drop file PDF di sini</p>
                                    <p class="text-gray-500 text-sm mb-3">atau</p>
                                    <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition" onclick="document.getElementById('fileInput').click()">
                                        Pilih File
                                    </button>
                                    <p class="text-gray-400 text-xs mt-3">Format: PDF | Max: 50MB</p>
                                </div>
                                <div id="dropZoneSuccess" style="display: none; text-align: center;">
                                    <i class="fas fa-check-circle text-green-500 text-4xl mb-2 block"></i>
                                    <p class="text-green-700 font-semibold" id="fileName"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2" id="uploadBtn">
                            <i class="fas fa-upload"></i>
                            Upload Invoice
                        </button>
                    </form>

                    <!-- Messages -->
                    <div id="message" class="mt-6"></div>
                </div>

                <!-- WhatsApp Messages Section -->
                <div id="whatsappContainer"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>

    <script>
        let zonas = [];

        // Load zonas on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadZonas();
            document.getElementById('invoiceForm').addEventListener('submit', handleUpload);
            setupDragAndDrop();
        });

        /**
         * Setup Drag & Drop functionality
         */
        function setupDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
                document.body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            // Highlight drop zone when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, unhighlight, false);
            });

            // Handle dropped files
            dropZone.addEventListener('drop', handleDrop, false);

            // Handle file selection via input
            fileInput.addEventListener('change', handleFileSelect, false);

            // Click on drop zone to open file picker
            dropZone.addEventListener('click', () => fileInput.click());

            function highlight(e) {
                dropZone.style.borderColor = '#3b82f6';
                dropZone.style.backgroundColor = '#eff6ff';
            }

            function unhighlight(e) {
                dropZone.style.borderColor = '#d1d5db';
                dropZone.style.backgroundColor = '#f9fafb';
            }

            function handleDrop(e) {
                e.preventDefault();
                e.stopPropagation();
                unhighlight(e);
                
                const dt = e.dataTransfer;
                const files = dt.files;
                fileInput.files = files;
                handleFileSelect({ target: { files } });
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                if (files.length > 0) {
                    const file = files[0];
                    
                    // Validate file type
                    if (file.type !== 'application/pdf') {
                        showMessage('File harus berformat PDF', 'error');
                        fileInput.value = '';
                        resetDropZone();
                        return;
                    }

                    // Validate file size (50MB max)
                    if (file.size > 50 * 1024 * 1024) {
                        showMessage('File terlalu besar (max 50MB)', 'error');
                        fileInput.value = '';
                        resetDropZone();
                        return;
                    }

                    // Show success state
                    const dropZoneContent = document.getElementById('dropZoneContent');
                    const dropZoneSuccess = document.getElementById('dropZoneSuccess');
                    const fileName = document.getElementById('fileName');

                    fileName.textContent = file.name;
                    dropZoneContent.style.display = 'none';
                    dropZoneSuccess.style.display = 'block';
                    dropZone.style.borderColor = '#10b981';
                    dropZone.style.backgroundColor = '#ecfdf5';
                }
            }

            function resetDropZone() {
                const dropZoneContent = document.getElementById('dropZoneContent');
                const dropZoneSuccess = document.getElementById('dropZoneSuccess');
                dropZoneContent.style.display = 'block';
                dropZoneSuccess.style.display = 'none';
                dropZone.style.borderColor = '#d1d5db';
                dropZone.style.backgroundColor = '#f9fafb';
            }
        }

        /**
         * Load all zonas
         */
        async function loadZonas() {
            try {
                const { data, error } = await window.supabase
                    .from('zonas')
                    .select('id, nama')
                    .order('nama');

                if (error) throw error;

                zonas = data || [];
                const zonaSelect = document.getElementById('zona');
                zonaSelect.innerHTML = '<option value="">-- Pilih Zona --</option>' +
                    zonas.map(z => `<option value="${z.id}">${z.nama}</option>`).join('');

            } catch (error) {
                console.error('Error loading zonas:', error);
                showMessage('Gagal memuat data zona', 'error');
            }
        }

        /**
         * Load zona-specific data (if needed)
         */
        function loadZonaData() {
            const zonaId = document.getElementById('zona').value;
            if (zonaId) {
                const zona = zonas.find(z => z.id == zonaId);
                console.log('Selected zona:', zona);
            }
        }

        /**
         * Handle invoice upload
         */
        async function handleUpload(e) {
            e.preventDefault();

            const zona_id = parseInt(document.getElementById('zona').value);
            const tipe = document.getElementById('tipe').value;
            const konsumen = document.getElementById('konsumen').value;
            const nominal = parseInt(document.getElementById('nominal').value);
            const file = document.getElementById('fileInput').files[0];

            if (!zona_id || !tipe || !konsumen || !nominal || !file) {
                showMessage('Semua field harus diisi', 'error');
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Loading...';

            try {
                // 1. Upload file to storage
                const fileName = `invoice_${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadError } = await window.supabase
                    .storage
                    .from('invoices')
                    .upload(`zone-${zona_id}/${fileName}`, file);

                if (uploadError) throw uploadError;

                // 2. Generate WhatsApp message
                const invoiceData = [{
                    zona_id: zona_id,
                    tipe: tipe,
                    konsumen: konsumen,
                    nominal: nominal
                }];

                const batchId = 'batch_' + Date.now();
                const token = API.getToken() || localStorage.getItem('jwt_token');

                console.log('[Upload] Calling API with token:', !!token);
                console.log('[Upload] Invoice data:', invoiceData);
                console.log('[Upload] Batch ID:', batchId);

                const response = await fetch('/api/whatsapp/generate-invoice-messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        invoices: invoiceData,
                        batchId: batchId
                    })
                });

                console.log('[Upload] API response status:', response.status);
                const result = await response.json();
                console.log('[Upload] API response:', result);

                if (response.ok && result.success) {
                    showMessage('✅ Invoice berhasil diupload! Pesan WhatsApp sudah digenerate.', 'success');
                    displayWhatsappMessages(result.notifications);
                    document.getElementById('invoiceForm').reset();
                } else {
                    throw new Error(result.error || 'Gagal generate pesan WhatsApp');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '<i class="fas fa-upload"></i> Upload Invoice';
            }
        }

        /**
         * Display WhatsApp messages
         */
        function displayWhatsappMessages(notifications) {
            const container = document.getElementById('whatsappContainer');

            const html = Object.entries(notifications).map(([zonaName, data]) => `
                <div class="whatsapp-panel">
                    <h3 style="margin-top: 0; color: #25d366;">
                        <i class="fab fa-whatsapp"></i> Pesan WhatsApp Zona ${zonaName}
                    </h3>
                    <div class="message-preview">${escapeHtml(data.message)}</div>
                    <button class="copy-btn" onclick="copyMessage('${escapeJsString(data.message)}', '${zonaName}')">
                        📋 Salin Pesan
                    </button>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        /**
         * Copy message to clipboard
         */
        async function copyMessage(message, zonaName) {
            try {
                await navigator.clipboard.writeText(message);
                if (typeof Toast !== 'undefined') {
                    Toast.success(`✅ Pesan zona ${zonaName} sudah disalin!`);
                }
            } catch (error) {
                console.error('Copy failed:', error);
                if (typeof Toast !== 'undefined') {
                    Toast.error('Gagal menyalin pesan');
                }
            }
        }

        /**
         * Show message
         */
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type === 'error' ? 'bg-red-50 border border-red-200 text-red-800' : 'bg-green-50 border border-green-200 text-green-800'} p-4 rounded-lg text-sm">${msg}</div>`;
        }

        /**
         * Escape HTML
         */
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Escape for JS string
         */
        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\')
                      .replace(/'/g, "\\'")
                      .replace(/"/g, '\\"')
                      .replace(/\n/g, '\\n')
                      .replace(/\r/g, '\\r');
        }
    </script>
            </div>
        </div>
    </div>
</body>
</html>
