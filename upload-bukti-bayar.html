<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Bukti Bayar - Pusat Arsip Anka</title>
    <!-- DARK MODE - Apply immediately to prevent flash -->
    <script>
        (function() {
            if (localStorage.getItem('dark_mode_enabled') === 'true') {
                document.documentElement.setAttribute('data-dark-mode', 'true');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        html[data-dark-mode="true"] .bg-white {
            background-color: var(--color-bg-secondary) !important;
            color: var(--color-text-primary);
        }
        
        html[data-dark-mode="true"] .bg-gray-50 {
            background-color: var(--color-bg-primary) !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-400,
        html[data-dark-mode="true"] .bg-green-600 {
            background-color: inherit !important;
        }
        
        html[data-dark-mode="true"] .text-gray-800,
        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] .text-gray-500,
        html[data-dark-mode="true"] .text-gray-600 {
            color: var(--color-text-secondary) !important;
        }
        
        html[data-dark-mode="true"] .border-gray-200,
        html[data-dark-mode="true"] .border-gray-100,
        html[data-dark-mode="true"] .border-blue-200 {
            border-color: var(--color-border) !important;
        }
        
        html[data-dark-mode="true"] .bg-blue-50 {
            background-color: var(--color-bg-secondary) !important;
        }
        
        html[data-dark-mode="true"] .text-blue-800 {
            color: #93c5fd !important;
        }
        
        html[data-dark-mode="true"] .bg-green-600 {
            background-color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] .hover\:bg-green-700:hover {
            background-color: #059669 !important;
        }
        
        html[data-dark-mode="true"] .text-green-100 {
            color: #d1fae5 !important;
        }
        
        html[data-dark-mode="true"] .text-green-600 {
            color: #10b981 !important;
        }
        
        html[data-dark-mode="true"] #dropZone {
            background: var(--color-bg-secondary) !important;
            border-color: #10b981 !important;
        }
        
        /* Stats cards dark mode */
        html[data-dark-mode="true"] #stats div[style*="background: #f8f9fa"] {
            background: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] #stats div[style*="color: #2c3e50"] {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] #stats div[style*="color: #7f8c8d"] {
            color: var(--color-text-secondary) !important;
        }
        
        /* File list items dark mode */
        html[data-dark-mode="true"] #filesContainer div[style*="background: #f8f9fa"] {
            background: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] #filesContainer div[style*="color: #2c3e50"] {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] #filesContainer div[style*="color: #7f8c8d"] {
            color: var(--color-text-secondary) !important;
        }
        
        /* Validating spinner dark mode */
        html[data-dark-mode="true"] #validating {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] #validating p {
            color: var(--color-text-primary) !important;
        }
        
        html[data-dark-mode="true"] .bg-gray-400 {
            background-color: #6b7280 !important;
        }
        
        html[data-dark-mode="true"] .hover\:bg-gray-500:hover {
            background-color: #4b5563 !important;
        }
        
        html[data-dark-mode="true"] .bg-f8f9fa {
            background-color: var(--color-bg-tertiary) !important;
        }
        
        html[data-dark-mode="true"] .text-e74c3c {
            color: #e74c3c !important;
        }

        .gradient-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Apply dark mode if enabled -->
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <style>
        #app {
            width: 100%;
        }
    </style>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div style="margin-left: 16rem; width: calc(100% - 16rem); transition: all 300ms ease;">
            <!-- Header -->
            <div class="gradient-header text-white sticky top-0 z-30 shadow-lg">
                <div class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2 rounded-lg">
                            <i class="fas fa-receipt text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold">Upload Bukti Bayar</h1>
                            <p class="text-green-100 text-xs mt-0.5">Upload dokumen bukti pembayaran invoice</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="p-4">
                <!-- Info Box -->
                <!-- Removed for compact layout -->

                <!-- Upload Card -->
                <div class="bg-white rounded-lg shadow-md p-5 mb-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt text-green-600"></i>
                        Drag & Drop Bukti Bayar
                    </h2>

                    <!-- Drop Zone -->
                    <div id="dropZone" style="border: 2px dashed #10b981; border-radius: 12px; padding: 40px 30px; text-align: center; cursor: pointer; transition: all 0.3s; background: #f0fdf4;">
                        <i class="fas fa-file-upload" style="font-size: 48px; color: #10b981; margin-bottom: 12px; display: block;"></i>
                        <p style="margin: 0 0 12px 0; color: #2c3e50; font-weight: 600; font-size: 14px;">Drag & drop file di sini</p>
                        <span style="font-size: 12px; color: #7f8c8d;">atau klik untuk memilih file (PDF, JPG, PNG)</span>
                    </div>

                    <!-- Validating Spinner -->
                    <div id="validating" style="display: none; text-align: center; padding: 25px;">
                        <div style="font-size: 36px; margin-bottom: 10px;">⏳</div>
                        <p style="color: #2c3e50; font-weight: 600; margin-bottom: 8px; font-size: 13px;">Validating Files...</p>
                        <p style="color: #7f8c8d; font-size: 12px;">Please wait while we check your files</p>
                    </div>

                    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" multiple style="display: none;">

                    <!-- Stats -->
                    <div id="stats" style="display: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0;">
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #2c3e50;" id="totalFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Total File</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #10b981;" id="validFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Valid ✓</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #e74c3c;" id="invalidFiles">0</div>
                            <div style="font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 3px;">Invalid ✗</div>
                        </div>
                    </div>

                    <!-- Files List -->
                    <div id="filesList" style="display: none; margin-top: 20px;">
                        <h4 style="color: #2c3e50; margin-bottom: 12px; font-size: 14px; font-weight: 600;">File Selection:</h4>
                        <div id="filesContainer"></div>
                    </div>

                    <!-- Buttons -->
                    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                        <button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-5 rounded-lg transition text-sm" onclick="resetUpload()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                        <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-lg transition text-sm" id="btnUpload" disabled>
                            <i class="fas fa-upload"></i> Upload Bukti Bayar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/spa-page-handler.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const btnUpload = document.getElementById('btnUpload');
            const stats = document.getElementById('stats');
            const filesList = document.getElementById('filesList');
            const filesContainer = document.getElementById('filesContainer');
            
            let selectedFiles = [];

            // Prevent default drag behaviors on the document
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            // Drag over
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = '#059669';
                dropZone.style.backgroundColor = '#dcfce7';
            });

            // Drag leave
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = '#10b981';
                dropZone.style.backgroundColor = '#f0fdf4';
            });

            // Drop
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.style.borderColor = '#10b981';
                dropZone.style.backgroundColor = '#f0fdf4';
                
                if (e.dataTransfer.files.length > 0) {
                    console.log('[Bukti Bayar] Files dropped:', e.dataTransfer.files.length);
                    handleFilesSelected(e.dataTransfer.files);
                }
            });

            // Click to select
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });

            // File input change
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    console.log('[Bukti Bayar] Files selected via input:', e.target.files.length);
                    handleFilesSelected(e.target.files);
                }
            });

            function handleFilesSelected(files) {
                console.log('[Bukti Bayar] Processing files...');
                selectedFiles = [];
                
                // Show validating spinner
                document.getElementById('validating').style.display = 'block';
                document.getElementById('filesList').style.display = 'none';
                document.getElementById('stats').style.display = 'none';
                
                // Validate files
                const validExtensions = ['pdf', 'jpg', 'jpeg', 'png'];
                let validCount = 0;
                let invalidCount = 0;

                // First pass: validate extensions
                const extensionValidated = [];
                Array.from(files).forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    
                    if (validExtensions.includes(ext) && file.size > 0) {
                        extensionValidated.push(file);
                        validCount++;
                    } else {
                        invalidCount++;
                        console.warn('[Bukti Bayar] Invalid file:', file.name);
                    }
                });

                // Second pass: check for duplicates on server
                checkForDuplicates(extensionValidated);
            }

            async function checkForDuplicates(files) {
                console.log('[Bukti Bayar] Checking for duplicates...');
                let validCount = 0;
                let invalidCount = 0;
                
                // Get token - fallback to localStorage if API not available
                const getToken = () => {
                    if (typeof API !== 'undefined' && API.getToken) {
                        return API.getToken();
                    }
                    return localStorage.getItem('access_token') || localStorage.getItem('jwt_token') || '';
                };
                const token = getToken();

                for (const file of files) {
                    // Extract faktur from filename
                    const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                    const faktur = nameWithoutExt.split('_')[0] || nameWithoutExt;
                    
                    let isDuplicate = false;
                    let errorMsg = '';
                    let tokoName = '';
                    let nominal = '';

                    if (faktur && faktur.trim()) {
                        try {
                            // Check if faktur exists
                            const checkRes = await fetch(`/api/invoice/check-faktur/${faktur}`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            
                            if (checkRes.ok) {
                                const result = await checkRes.json();
                                if (result.exists && result.data) {
                                    // Get toko name and nominal
                                    tokoName = result.data.konsumen || result.data.toko || '-';
                                    nominal = result.data.total_jumlah_jual || 0;
                                    
                                    if (result.data.bukti_bayar_path) {
                                        // Check if file truly exists in GDrive
                                        try {
                                            const fileCheckRes = await fetch(`/api/invoice/check-file/${faktur}/bukti_bayar`, {
                                                headers: { 'Authorization': `Bearer ${token}` }
                                            });
                                            const fileCheckData = await fileCheckRes.json();
                                            
                                            if (fileCheckData.exists) {
                                                isDuplicate = true;
                                                errorMsg = 'Bukti Bayar sudah diupload (Duplicate)';
                                                invalidCount++;
                                            } else {
                                                // File was deleted from GDrive - allow re-upload
                                                validCount++;
                                                file.tokoName = tokoName;
                                                file.nominal = nominal;
                                                selectedFiles.push(file);
                                            }
                                        } catch (fileCheckErr) {
                                            // If check fails, allow re-upload
                                            console.log('[Bukti Bayar] File check error, allowing:', fileCheckErr.message);
                                            validCount++;
                                            file.tokoName = tokoName;
                                            file.nominal = nominal;
                                            selectedFiles.push(file);
                                        }
                                    } else {
                                        // No existing path - new upload
                                        validCount++;
                                        file.tokoName = tokoName;
                                        file.nominal = nominal;
                                        selectedFiles.push(file);
                                    }
                                } else {
                                    // Faktur not found - allow upload anyway
                                    validCount++;
                                    selectedFiles.push(file);
                                }
                            } else {
                                // Faktur not found - allow upload anyway
                                validCount++;
                                selectedFiles.push(file);
                            }
                        } catch (err) {
                            console.log('[Bukti Bayar] Duplicate check error:', err);
                            // If check fails, allow upload
                            validCount++;
                            selectedFiles.push(file);
                        }
                    } else {
                        // No faktur detected
                        invalidCount++;
                        errorMsg = 'Format filename salah';
                    }
                }

                // Update stats
                document.getElementById('totalFiles').textContent = files.length;
                document.getElementById('validFiles').textContent = validCount;
                document.getElementById('invalidFiles').textContent = invalidCount;
                
                // Hide validating spinner
                document.getElementById('validating').style.display = 'none';

                // Show file list and stats
                if (selectedFiles.length > 0) {
                    stats.style.display = 'grid';
                    filesList.style.display = 'block';
                    btnUpload.disabled = false;
                    
                    // Render files list
                    filesContainer.innerHTML = selectedFiles.map((file, idx) => {
                        const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                        const faktur = nameWithoutExt.split('_')[0] || nameWithoutExt;
                        const tokoName = file.tokoName || '-';
                        const nominal = file.nominal ? 'Rp ' + file.nominal.toLocaleString('id-ID') : '-';
                        
                        return `
                            <div style="background: #f8f9fa; padding: 12px 15px; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;">
                                <div style="font-size: 18px; color: #10b981;">✓</div>
                                <div style="flex: 1;">
                                    <div style="font-size: 13px; font-weight: 600; color: #2c3e50;">${file.name}</div>
                                    <div style="font-size: 11px; color: #7f8c8d; margin-top: 2px;">Faktur: ${faktur} | ${tokoName} | ${nominal}</div>
                                </div>
                                <button onclick="removeFile(${idx})" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">✕ Remove</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    stats.style.display = 'none';
                    filesList.style.display = 'none';
                    btnUpload.disabled = true;
                }
            }

            window.removeFile = function(idx) {
                selectedFiles.splice(idx, 1);
                handleFilesSelected(selectedFiles);
            };

            window.resetUpload = function() {
                selectedFiles = [];
                fileInput.value = '';
                dropZone.style.borderColor = '#10b981';
                dropZone.style.backgroundColor = '#f0fdf4';
                stats.style.display = 'none';
                filesList.style.display = 'none';
                btnUpload.disabled = true;
                console.log('[Bukti Bayar] Reset completed');
            };

            document.getElementById('btnUpload').addEventListener('click', async () => {
                if (selectedFiles.length === 0) {
                    if (typeof Toast !== 'undefined') {
                        Toast.error('Pilih file terlebih dahulu');
                    } else {
                        alert('Pilih file terlebih dahulu');
                    }
                    return;
                }

                const btn = document.getElementById('btnUpload');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

                try {
                    const token = localStorage.getItem('jwt_token') || localStorage.getItem('access_token');
                    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                    for (const file of selectedFiles) {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('type', 'bukti_bayar');

                        const response = await fetch('/api/invoice/upload-document', {
                            method: 'POST',
                            body: formData,
                            headers: { 'Authorization': `Bearer ${token}` }
                        });

                        if (!response.ok) {
                            throw new Error(`Upload failed for ${file.name}`);
                        }

                        console.log('[Bukti Bayar] Uploaded:', file.name);
                    }

                    if (typeof Toast !== 'undefined') {
                        Toast.success('✅ Bukti Bayar berhasil diupload!');
                    } else {
                        alert('✅ Bukti Bayar berhasil diupload!');
                    }
                    window.resetUpload();
                } catch (error) {
                    console.error('[Bukti Bayar] Upload error:', error);
                    if (typeof Toast !== 'undefined') {
                        Toast.error('❌ Upload gagal: ' + error.message);
                    } else {
                        alert('❌ Upload gagal: ' + error.message);
                    }
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        });
    </script>
    <script>
        // Initialize once when page loads (for SPA support)
        if (!window.__uploadBuktiBayarInit && document.readyState !== 'loading') {
            window.__uploadBuktiBayarInit = true;
            document.dispatchEvent(new Event('DOMContentLoaded'));
        }
    </script>
</body>
</html>
