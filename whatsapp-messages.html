<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi Zona - Pusat Arsip Anka</title>
    <!-- DARK MODE - Apply immediately to prevent flash -->
    <script src="js/dark-mode-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #f3f4f6;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        /* Dark mode styling */
        html[data-dark-mode="true"] .bg-white {
            background: var(--color-bg-secondary) !important;
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .text-gray-500 {
            color: var(--color-text-secondary) !important;
        }

        html[data-dark-mode="true"] .text-gray-400 {
            color: var(--color-text-secondary) !important;
        }

        html[data-dark-mode="true"] .border-gray-100 {
            border-color: var(--color-border) !important;
        }

        html[data-dark-mode="true"] .border-gray-200 {
            border-color: var(--color-border) !important;
        }

        html[data-dark-mode="true"] .bg-gray-50 {
            background: var(--color-bg-primary) !important;
        }

        html[data-dark-mode="true"] .bg-gray-100 {
            background: var(--color-bg-tertiary) !important;
        }

        html[data-dark-mode="true"] .hover\:bg-gray-50:hover {
            background: var(--color-bg-tertiary) !important;
        }

        html[data-dark-mode="true"] table td,
        html[data-dark-mode="true"] table th {
            color: var(--color-text-primary) !important;
            border-color: var(--color-border) !important;
        }

        html[data-dark-mode="true"] tbody tr {
            background: var(--color-bg-secondary) !important;
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] tbody tr:hover {
            background: var(--color-bg-tertiary) !important;
        }

        html[data-dark-mode="true"] thead {
            background: var(--color-bg-tertiary) !important;
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .shadow-md {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3) !important;
        }

        html, body { zoom: 0.8; }

        /* TAB STYLING */
        .tab-btn {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            position: relative;
            color: #6b7280;
        }

        .tab-btn:hover {
            color: #1f2937;
        }

        .tab-active {
            color: #ef4444;
            border-bottom: 3px solid #ef4444;
            margin-bottom: -1px;
        }

        .tab-inactive {
            color: #6b7280;
        }

        .tab-content {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Apply dark mode if enabled -->
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <div id="app">
        <div id="sidebar"></div>
        <div style="margin-left: 20rem; width: calc(100% - 20rem); transition: all 300ms ease;">
            <div class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
                <div class="px-6 py-4"><h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Notifikasi WhatsApp</h2></div>
            </div>
            <div class="p-6">
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">📱 Pesan WhatsApp</h1>
                            <p class="text-gray-500 font-medium mt-1">Salin dan kirim pesan WhatsApp per zona</p>
                        </div>
                    </div>

                    <!-- Invoice Messages Only -->
                    <div class="space-y-4">
                        <div id="invoice-messages-body" class="space-y-4">
                            <div class="text-center text-gray-500 py-8"><i class="fas fa-spinner fa-spin"></i> Memuat pesan...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/spa-page-handler.js"></script>
    <script>
        let currentMessages = [], currentInvoiceMessages = [];
        
        async function initNotifyZonaPage() {
            console.log('[NotifyZona] Page initializing');
            await initAuth(); 
            await loadSidebar('whatsapp-messages.html'); 
            await loadMessages();
        }
        
        // Run on direct page load
        document.addEventListener('DOMContentLoaded', initNotifyZonaPage);
        
        // For SPA: call directly after page loads (spa-page-handler will trigger this via custom script)
        // This will be called by the inline script at bottom of page
        window.initNotifyZona = initNotifyZonaPage;

        async function loadMessages() {
            try {
                const invoiceMsgs = await API.get('/api/whatsapp/pending-invoice-messages').catch(() => ({}));
                
                console.log('[Notify WA] Response from API:', invoiceMsgs);
                
                // Response is an object with notifications grouped by zona name (from backend)
                // notifications: { "Zona Name": [{msg1}, {msg2}], "Another Zona": [...] }
                // Or it could be { notifications: {...}, count: X, ... }
                
                let messagesObj = invoiceMsgs.notifications || invoiceMsgs;
                console.log('[Notify WA] Extracted messages:', messagesObj);
                
                // Convert grouped object to flat array for rendering
                // messagesObj is: { "Zona Name": [{...}], "Zona 2": [{...}] }
                if (messagesObj && typeof messagesObj === 'object' && !Array.isArray(messagesObj)) {
                    currentInvoiceMessages = [];
                    Object.entries(messagesObj).forEach(([zonaName, msgs]) => {
                        if (Array.isArray(msgs)) {
                            currentInvoiceMessages.push(...msgs);
                        }
                    });
                    console.log('[Notify WA] Flattened messages array:', currentInvoiceMessages);
                } else if (Array.isArray(messagesObj)) {
                    currentInvoiceMessages = messagesObj;
                } else {
                    currentInvoiceMessages = [];
                }
                
                console.log('[Notify WA] Final messages array:', currentInvoiceMessages);
                renderMessages();
            } catch (err) {
                console.error('[Notify WA] Error loading messages:', err);
                document.getElementById('invoice-messages-body').innerHTML = '<div class="text-center text-gray-500 py-8">Gagal memuat pesan</div>';
            }
        }

        function renderMessages() {
            // Invoice messages ONLY
            const invMsgBody = document.getElementById('invoice-messages-body');
            if (!currentInvoiceMessages || currentInvoiceMessages.length === 0) {
                invMsgBody.innerHTML = '<div class="text-center text-gray-500 py-8">Belum ada pesan</div>';
                return;
            }

            // Separate into active (pending) and sent
            const activeMessages = currentInvoiceMessages.filter(msg => !msg.sent_at);
            const sentMessages = currentInvoiceMessages.filter(msg => msg.sent_at);

            // Determine active tab
            const activeTab = sessionStorage.getItem('whatsappTab') || 'active';

            let html = `
                <!-- TAB NAVIGATION -->
                <div class="flex gap-0 mb-6 border-b border-gray-300">
                    <button class="tab-btn ${activeTab === 'active' ? 'tab-active' : 'tab-inactive'}" data-tab="active">
                        <i class="fas fa-paper-plane"></i> Pesan Aktif (${activeMessages.length})
                    </button>
                    <button class="tab-btn ${activeTab === 'sent' ? 'tab-active' : 'tab-inactive'}" data-tab="sent">
                        <i class="fas fa-check-circle"></i> Sudah Terkirim (${sentMessages.length})
                    </button>
                </div>

                <!-- TAB CONTENT -->
                <div class="tab-content">
            `;

            // ACTIVE MESSAGES TAB
            if (activeTab === 'active') {
                if (activeMessages.length === 0) {
                    html += '<div class="text-center text-gray-500 py-8">Semua pesan sudah terkirim</div>';
                } else {
                    html += `<div class="space-y-4">
                        ${activeMessages.map(msg => renderMessageCard(msg)).join('')}
                    </div>`;
                }
            }

            // SENT MESSAGES TAB
            if (activeTab === 'sent') {
                if (sentMessages.length === 0) {
                    html += '<div class="text-center text-gray-500 py-8">Belum ada pesan yang terkirim</div>';
                } else {
                    html += `<div class="space-y-4">
                        ${sentMessages.map(msg => renderMessageCard(msg)).join('')}
                    </div>`;
                }
            }

            html += `</div>`;

            invMsgBody.innerHTML = html;

            // Add tab click listeners
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    sessionStorage.setItem('whatsappTab', this.getAttribute('data-tab'));
                    renderMessages();
                });
            });
        }

        function renderMessageCard(msg) {
            const isPending = !msg.sent_at;
            const zonaName = msg.zonas?.nama || `Zona ${msg.zona_id}`;
            
            return `
                <div class="bg-white rounded-lg border border-gray-200 p-5 hover:shadow-md transition">
                    <!-- Header: Zona name + Status -->
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-gray-900">📍 ${zonaName}</h3>
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${isPending ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">
                            ${isPending ? '⏳ Aktif' : '✓ Terkirim'}
                        </span>
                    </div>

                    <!-- Message Box -->
                    <div class="bg-gray-50 rounded-lg p-4 mb-4 border-l-4 border-green-500 font-mono text-sm whitespace-pre-wrap text-gray-800" style="max-height: 200px; overflow-y: auto;">
${msg.message || 'N/A'}
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-2">
                        <button class="btn-copy flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm flex items-center justify-center" data-msg-id="${msg.id}" data-message="${escapeHtml(msg.message)}">
                            <i class="fas fa-copy mr-2"></i>Salin Pesan
                        </button>
                        <button class="btn-delete flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm flex items-center justify-center" data-msg-id="${msg.id}">
                            <i class="fas fa-trash mr-2"></i>Hapus
                        </button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Event listeners for buttons
        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-copy')) {
                const btn = e.target.closest('.btn-copy');
                const msgId = btn.getAttribute('data-msg-id');
                const message = btn.getAttribute('data-message');
                copyMessage(msgId, message);
            }
            if (e.target.closest('.btn-delete')) {
                const btn = e.target.closest('.btn-delete');
                const msgId = btn.getAttribute('data-msg-id');
                deleteInvoiceMessage(msgId);
            }
        });

        async function copyMessage(msgId, message) {
            try {
                await navigator.clipboard.writeText(message);
                
                // Show copy success toast
                if (typeof Toast !== 'undefined') {
                    Toast.success('✓ Pesan berhasil disalin ke clipboard');
                } else {
                    alert('Pesan berhasil disalin!');
                }
                
                // Auto-mark as sent
                await API.post('/api/whatsapp/mark-invoice-sent', { notificationId: msgId });
                
                // Reload messages to show moved to "Sudah Terkirim"
                await loadMessages();
                
            } catch (err) {
                if (typeof Toast !== 'undefined') {
                    Toast.error('Error: ' + err.message);
                } else {
                    alert('Error: ' + err.message);
                }
            }
        }

        async function deleteInvoiceMessage(msgId) {
            try {
                await API.post('/api/whatsapp/delete-invoice-message', { notificationId: msgId });
                await loadMessages();
                if (typeof Toast !== 'undefined') {
                    Toast.success('✓ Pesan dihapus');
                }
            } catch (err) {
                if (typeof Toast !== 'undefined') {
                    Toast.error('Error: ' + err.message);
                } else {
                    alert('Error: ' + err.message);
                }
            }
        }
        
        // SPA Initialization: If this page was loaded via SPA, initNotifyZona will be defined
        // Call it immediately after page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                console.log('[NotifyZona] Page ready, initializing...');
                if (typeof initNotifyZona === 'function') {
                    initNotifyZona();
                }
            });
        } else {
            // Page already loaded (shouldn't happen in normal flow, but just in case)
            console.log('[NotifyZona] Page already ready, initializing...');
            if (typeof initNotifyZona === 'function') {
                initNotifyZona();
            }
        }
    </script>
</body>
</html>
