    <style>
        :root {
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f5f7fa;
            --color-bg-tertiary: #f3f4f6;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        html[data-dark-mode="true"] {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
        }
        
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        /* Dark mode styling */
        html[data-dark-mode="true"] .bg-white {
            background: var(--color-bg-secondary) !important;
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .text-gray-900 {
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .text-gray-500,
        html[data-dark-mode="true"] .text-gray-600 {
            color: var(--color-text-secondary) !important;
        }

        html[data-dark-mode="true"] .text-gray-400 {
            color: var(--color-text-secondary) !important;
        }

        html[data-dark-mode="true"] .border-gray-100,
        html[data-dark-mode="true"] .border-gray-200 {
            border-color: var(--color-border) !important;
        }

        html[data-dark-mode="true"] .bg-gray-50,
        html[data-dark-mode="true"] .bg-gray-100 {
            background: var(--color-bg-tertiary) !important;
        }

        html[data-dark-mode="true"] .hover\:bg-gray-50:hover {
            background: var(--color-bg-tertiary) !important;
        }

        html[data-dark-mode="true"] .shadow-md,
        html[data-dark-mode="true"] .shadow-lg {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
        }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        html[data-dark-mode="true"] .glass-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        html[data-dark-mode="true"] .glass-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* STAT CARDS */
        .stat-card {
            position: relative;
            overflow: hidden;
        }

        /* TAB STYLING - MODERN */
        .tab-container {
            background: var(--color-bg-secondary);
            border-radius: 16px;
            padding: 6px;
            display: inline-flex;
            gap: 4px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .tab-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            position: relative;
            color: var(--color-text-secondary);
            border-radius: 12px;
        }

        .tab-btn:hover {
            color: var(--color-text-primary);
            background: rgba(0, 0, 0, 0.03);
        }

        html[data-dark-mode="true"] .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-active {
            color: #fff !important;
            background: var(--gradient-primary) !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        html[data-dark-mode="true"] .tab-active {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        .tab-content {
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MESSAGE BOX */
        .message-box {
            position: relative;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border-left: 4px solid #10b981;
        }

        html[data-dark-mode="true"] .message-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(5, 150, 105, 0.05) 100%);
            border-left-color: #10b981;
            color: var(--color-text-primary) !important;
        }

        html[data-dark-mode="true"] .message-box * {
            color: var(--color-text-primary) !important;
        }

        /* BUTTONS - MODERN */
        .btn-modern {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-modern::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-modern:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-modern:active {
            transform: scale(0.95);
        }

        /* GRADIENT BACKGROUNDS */
        .bg-gradient-primary {
            background: var(--gradient-primary);
        }

        .bg-gradient-success {
            background: var(--gradient-success);
        }

        .bg-gradient-danger {
            background: var(--gradient-danger);
        }

        /* BADGE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* PULSE ANIMATION */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Scale down WhatsApp Messages UI to 80% */
        #main-content > div {
            transform: scale(0.8);
            transform-origin: top left;
            width: 125%;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Apply dark mode if enabled -->
    <script>
        if (localStorage.getItem('dark_mode_enabled') === 'true') {
            document.documentElement.setAttribute('data-dark-mode', 'true');
        }
    </script>
    <div id="app" style="width: 100%; display: flex; margin: 0; padding: 0; overflow-x: hidden;">
        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <div id="main-content" style="flex: 1; min-width: 0; transition: all 300ms ease; display: flex; flex-direction: column;">
            <!-- Header with gradient -->
            <div class="bg-white sticky top-0 z-30 shadow-lg border-b border-gray-100" style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);">
                <div class="px-6 py-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">WhatsApp Notifications</h2>
                            <h1 class="text-3xl font-black text-gray-900 flex items-center gap-3">
                                <span class="text-4xl">💬</span>

                        <div class="flex items-center gap-3">

                                <span>Refresh</span>

            <!-- Main Content Area -->
            <div class="p-6">
                <!-- Stat Cards -->
                <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <!-- Stats will be inserted here -->
                </div>

                <!-- Messages Section -->
                <div class="space-y-6">
                    <div id="invoice-messages-body" class="space-y-4">
                        <div class="text-center text-gray-500 py-12">
                            <div class="inline-block">
                                <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-4"></i>
                                <p class="text-lg font-semibold">Memuat pesan...</p>
                            </div>
                        </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js?t=20261009175817"></script>
    <script src="js/spa-page-handler.js"></script>
    <script>
        // Prevent redeclaration when SPA router reloads the page
        if (typeof window._notifyZonaModuleLoaded === 'undefined') {
            window._notifyZonaModuleLoaded = true;
            
            let currentMessages = [], currentInvoiceMessages = [];
            
            async function initNotifyZonaPage() {
                await initAuth(); 
                await loadSidebar('whatsapp-messages.html'); 
                await loadMessages();
            }
            
            // Run on direct page load
            document.addEventListener('DOMContentLoaded', initNotifyZonaPage);
            
            // For SPA: call directly after page loads (spa-page-handler will trigger this via custom script)
            // This will be called by the inline script at bottom of page
            window.initNotifyZona = initNotifyZonaPage;

            async function loadMessages() {
                try {
                    const invoiceMsgs = await API.get('/api/whatsapp/pending-invoice-messages').catch(() => ({}));
                    
                    
                    // Response is an object with notifications grouped by zona name (from backend)
                    // notifications: { "Zona Name": [{msg1}, {msg2}], "Another Zona": [...] }
                    // Or it could be { notifications: {...}, count: X, ... }
                    
                    let messagesObj = invoiceMsgs.notifications || invoiceMsgs;
                    
                    // Convert grouped object to flat array for rendering
                    // messagesObj is: { "Zona Name": [{...}], "Zona 2": [{...}] }
                    if (messagesObj && typeof messagesObj === 'object' && !Array.isArray(messagesObj)) {
                        currentInvoiceMessages = [];
                        Object.entries(messagesObj).forEach(([zonaName, msgs]) => {
                            if (Array.isArray(msgs)) {
                                currentInvoiceMessages.push(...msgs);
                            }
                        });
                    } else if (Array.isArray(messagesObj)) {
                        currentInvoiceMessages = messagesObj;
                    } else {
                        currentInvoiceMessages = [];
                    }
                    
                    renderMessages();
                } catch (err) {
                    document.getElementById('invoice-messages-body').innerHTML = '<div class="text-center text-gray-500 py-8">Gagal memuat pesan</div>';
                }
            }

            function renderMessages() {
            // Invoice messages ONLY
            const invMsgBody = document.getElementById('invoice-messages-body');
            
            
            if (!invMsgBody) {
                // Retry after delay - element might not be in DOM yet
                setTimeout(() => {
                    renderMessages();
                }, 300);
                return;
            }
            
            if (!currentInvoiceMessages || currentInvoiceMessages.length === 0) {
                invMsgBody.innerHTML = `
                    <div class="text-center py-12">
                        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gray-100 mb-4">
                            <i class="fas fa-inbox text-4xl text-gray-400"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-600">Belum ada pesan</p>
                        <p class="text-sm text-gray-500 mt-2">Pesan WhatsApp akan muncul di sini</p>
                    </div>
                `;
                updateStats(0, 0);
                return;
            }
            

            // Separate into active (pending) and sent
            const activeMessages = currentInvoiceMessages.filter(msg => !msg.sent_at);
            const sentMessages = currentInvoiceMessages.filter(msg => msg.sent_at);

            // Update stat cards
            updateStats(activeMessages.length, sentMessages.length);

            // Determine active tab
            const activeTab = sessionStorage.getItem('whatsappTab') || 'active';

            let html = `
                <!-- TAB NAVIGATION - MODERN -->
                <div class="flex justify-center mb-8">
                    <div class="tab-container">
                        <button class="tab-btn ${activeTab === 'active' ? 'tab-active' : ''}" data-tab="active">
                            <i class="fas fa-paper-plane"></i>
                            <span>Pesan Aktif</span>
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-white bg-opacity-20 text-xs font-black">${activeMessages.length}</span>
                        </button>
                        <button class="tab-btn ${activeTab === 'sent' ? 'tab-active' : ''}" data-tab="sent">
                            <i class="fas fa-check-circle"></i>
                            <span>Sudah Terkirim</span>
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-white bg-opacity-20 text-xs font-black">${sentMessages.length}</span>
                        </button>
                    </div>
                </div>

                <!-- TAB CONTENT -->
                <div class="tab-content">
            `;

            // ACTIVE MESSAGES TAB
            if (activeTab === 'active') {
                if (activeMessages.length === 0) {
                    html += `
                        <div class="text-center py-12">
                            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-green-50 mb-4">
                                <i class="fas fa-check-circle text-4xl text-green-500"></i>
                            </div>
                            <p class="text-lg font-semibold text-gray-600">Semua pesan sudah terkirim</p>
                            <p class="text-sm text-gray-500 mt-2">Tidak ada pesan yang menunggu pengiriman</p>
                        </div>
                    `;
                } else {
                    html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        ${activeMessages.map(msg => renderMessageCard(msg)).join('')}
                    </div>`;
                }
            }

            // SENT MESSAGES TAB
            if (activeTab === 'sent') {
                if (sentMessages.length === 0) {
                    html += `
                        <div class="text-center py-12">
                            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gray-100 mb-4">
                                <i class="fas fa-clock text-4xl text-gray-400"></i>
                            </div>
                            <p class="text-lg font-semibold text-gray-600">Belum ada pesan yang terkirim</p>
                            <p class="text-sm text-gray-500 mt-2">Kirim pesan pertama Anda dari tab "Pesan Aktif"</p>
                        </div>
                    `;
                } else {
                    html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        ${sentMessages.map(msg => renderMessageCard(msg)).join('')}
                    </div>`;
                }
            }

            html += `</div>`;

            invMsgBody.innerHTML = html;

            // Add tab click listeners
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    sessionStorage.setItem('whatsappTab', this.getAttribute('data-tab'));
                    renderMessages();
                });
            });
        }

        function updateStats(activeCount, sentCount) {
            const statsContainer = document.getElementById('stats-container');
            if (!statsContainer) return;

            const totalCount = activeCount + sentCount;

            statsContainer.innerHTML = `
                <!-- Total Messages -->
                <div class="glass-card stat-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-primary flex items-center justify-center shadow-lg">
                                <i class="fas fa-envelope text-xl text-white"></i>
                            </div>
                            <div>
                                <p class="text-xs font-black text-gray-400 uppercase tracking-widest">Total Pesan</p>
                                <p class="text-3xl font-black text-gray-900 mt-1">${totalCount}</p>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs font-semibold text-gray-500">Semua notifikasi</p>
                </div>

                <!-- Active Messages -->
                <div class="glass-card stat-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-success flex items-center justify-center shadow-lg">
                                <i class="fas fa-paper-plane text-xl text-white"></i>
                            </div>
                            <div>
                                <p class="text-xs font-black text-gray-400 uppercase tracking-widest">Pesan Aktif</p>
                                <p class="text-3xl font-black text-gray-900 mt-1">${activeCount}</p>
                            </div>
                        </div>
                        ${activeCount > 0 ? '<div class="pulse-animation"><i class="fas fa-circle text-green-500 text-xs"></i></div>' : ''}
                    </div>
                    <p class="text-xs font-semibold text-gray-500">Menunggu pengiriman</p>
                </div>

                <!-- Sent Messages -->
                <div class="glass-card stat-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-danger flex items-center justify-center shadow-lg">
                                <i class="fas fa-check-circle text-xl text-white"></i>
                            </div>
                            <div>
                                <p class="text-xs font-black text-gray-400 uppercase tracking-widest">Terkirim</p>
                                <p class="text-3xl font-black text-gray-900 mt-1">${sentCount}</p>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs font-semibold text-gray-500">Berhasil dikirim</p>
                </div>
            `;
        }

        function renderMessageCard(msg) {
            const isPending = !msg.sent_at;
            const zonaName = msg.zonas?.nama || `Zona ${msg.zona_id}`;
            
            return `
                <div class="glass-card rounded-2xl p-6 transition-all duration-300">
                    <!-- Header: Zona name + Status -->
                    <div class="flex items-start justify-between mb-5">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-primary flex items-center justify-center shadow-lg flex-shrink-0">
                                <i class="fas fa-map-marker-alt text-xl text-white"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-black text-gray-900">${zonaName}</h3>
                                <p class="text-xs text-gray-500 font-medium mt-1">
                                    <i class="fas fa-clock mr-1"></i>
                                    ${msg.created_at ? new Date(msg.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A'}
                                </p>
                            </div>
                        </div>
                        <span class="status-badge ${isPending ? 'bg-blue-500 text-white' : 'bg-green-500 text-white'}">
                            ${isPending ? '<i class="fas fa-hourglass-half"></i> Aktif' : '<i class="fas fa-check-double"></i> Terkirim'}
                        </span>
                    </div>

                    <!-- Message Box -->
                    <div class="message-box rounded-xl p-4 mb-5 font-mono text-sm whitespace-pre-wrap text-gray-800 shadow-inner" style="max-height: 200px; overflow-y: auto;">
${msg.message || 'N/A'}
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-3">
                        <button class="btn-copy btn-modern flex-1 bg-gradient-success text-white font-bold py-3 px-5 rounded-xl shadow-lg hover:shadow-xl text-sm flex items-center justify-center gap-2" data-msg-id="${msg.id}" data-message="${escapeHtml(msg.message)}">
                            <i class="fas fa-copy text-lg"></i>
                            <span>Salin Pesan</span>
                        </button>
                        <button class="btn-delete btn-modern bg-gradient-danger text-white font-bold py-3 px-5 rounded-xl shadow-lg hover:shadow-xl text-sm flex items-center justify-center gap-2" data-msg-id="${msg.id}">
                            <i class="fas fa-trash text-lg"></i>
                            <span>Hapus</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Event listeners for buttons
        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-copy')) {
                const btn = e.target.closest('.btn-copy');
                const msgId = btn.getAttribute('data-msg-id');
                const message = btn.getAttribute('data-message');
                copyMessage(msgId, message);
            }
            if (e.target.closest('.btn-delete')) {
                const btn = e.target.closest('.btn-delete');
                const msgId = btn.getAttribute('data-msg-id');
                deleteInvoiceMessage(msgId);
            }
        });

        async function copyMessage(msgId, message) {
            try {
                await navigator.clipboard.writeText(message);
                
                // Show copy success toast
                if (typeof Toast !== 'undefined') {
                    Toast.success('? Pesan berhasil disalin ke clipboard');
                } else {
                    Notify.success('Pesan berhasil disalin!');
                }
                
                // Auto-mark as sent
                await API.post('/api/whatsapp/mark-invoice-sent', { notificationId: msgId });
                
                // Reload messages to show moved to "Sudah Terkirim"
                await loadMessages();
                
            } catch (err) {
                if (typeof Toast !== 'undefined') {
                    Toast.error('Error: ' + err.message);
                } else {
                    Notify.error('Error: ' + err.message);
                }
            }
        }

        async function deleteInvoiceMessage(msgId) {
            try {
                await API.post('/api/whatsapp/delete-invoice-message', { notificationId: msgId });
                await loadMessages();
                if (typeof Toast !== 'undefined') {
                    Toast.success('? Pesan dihapus');
                }
            } catch (err) {
                if (typeof Toast !== 'undefined') {
                    Toast.error('Error: ' + err.message);
                } else {
                    Notify.error('Error: ' + err.message);
                }
            }
        }
